name: Qwen audio

# Makes recorded audio with the Qwen voice (qwen3-tts-flash) once, saves it in audio/ and lists it in data/audio-manifest.js, so the site plays files:
# no key is needed to hear them and nothing is paid per tap. Run it by hand from the Actions tab (choose the scope; try "words" first).
# It needs the repository secret DASHSCOPE_API_KEY (Settings > Secrets and variables > Actions): the Alibaba Model Studio key for Singapore.
# Lines that already have a file are skipped, so running again only fills the gaps.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to make: style (tests whether instructions give a plainer reading, about 45 short recordings), trial (a few sentences and words to listen to, about 1 cent), words, examples, lab, exams, extra, core (words+examples+lab+exams) or all'
        default: 'words'
      limit:
        description: 'Make at most this many new files (0 = no limit)'
        default: '0'
      voice_f:
        description: 'The woman voice (words, sentences, lab, exam women)'
        default: 'Maia'
      voice_m:
        description: 'The man voice (lines spoken by 男 in exam conversations). Use Maia too if you want one voice everywhere'
        default: 'Kai'
      redo:
        description: 'Texts to make again, comma separated (leave empty normally)'
        default: ''

permissions:
  contents: write

concurrency:
  group: qwen-audio

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Say what will be made
        env:
          SCOPE: ${{ inputs.scope }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$SCOPE" = trial ] || [ "$SCOPE" = style ]; then
            echo "$SCOPE set, a few dozen short recordings, a few cents"
          else
            python3 tools/make-audio.py --scope "$SCOPE" --limit "$LIMIT" --dry-run
          fi
      - name: Make the audio
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SCOPE: ${{ inputs.scope }}
          LIMIT: ${{ inputs.limit }}
          REDO: ${{ inputs.redo }}
          VOICE_F: ${{ inputs.voice_f }}
          VOICE_M: ${{ inputs.voice_m }}
        run: |
          if [ "$SCOPE" = trial ]; then
            python3 tools/make-trial-audio.py --voice "$VOICE_F"
          elif [ "$SCOPE" = style ]; then
            python3 tools/make-style-trial.py
          else
            python3 tools/make-audio.py --scope "$SCOPE" --limit "$LIMIT" --redo "$REDO" --voice-f "$VOICE_F" --voice-m "$VOICE_M" --workers 3
          fi
      - name: Save the files and the list
        if: always()
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          python3 tools/build-audio.py
          node tools/build-site.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio data/audio-manifest.js index.html sw.js
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Qwen audio: $SCOPE (made by the Qwen audio workflow)"
          git pull --rebase -q
          git push
