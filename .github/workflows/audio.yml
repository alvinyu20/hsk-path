name: Qwen audio

# Makes recorded audio with Alibaba's Qwen-Audio 3.1 voice (longanhuan_v3.1, plain textbook-reading instruction) once, saves it in audio/ and lists it in data/audio-manifest.js, so the site plays files:
# no key is needed to hear them and nothing is paid per tap. Run it by hand from the Actions tab (choose the scope; try "words" first).
# It needs the repository secret DASHSCOPE_API_KEY (Settings > Secrets and variables > Actions): the Alibaba Model Studio key for Singapore.
# Lines that already have a file are skipped, so running again only fills the gaps.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to make: words, examples, lab, exams, passages, extra, journey, core (words+examples+lab+exams+passages) or all'
        default: 'words'
      level:
        description: 'Only the texts that this HSK level uses: 1, 2, 3, 4 or 5 (empty = every level)'
        default: ''
      limit:
        description: 'Make at most this many new files (0 = no limit)'
        default: '0'
      voice_f:
        description: 'The woman voice (words, sentences, lab, exam women). longanhuan_v3.1: chosen by listening'
        default: 'longanhuan_v3.1'
      voice_m:
        description: 'The man voice (lines spoken by 男 in exam conversations). Not tried yet: check the first exam clips'
        default: 'xunanchuan_v3.1'
      redo:
        description: 'Texts to make again, comma separated, or * for everything in the scope (use * after changing voice). Leave empty normally'
        default: ''

permissions:
  contents: write

concurrency:
  group: qwen-audio

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Say what will be made
        env:
          SCOPE: ${{ inputs.scope }}
          LEVEL: ${{ inputs.level }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python3 tools/make-audio.py --scope "$SCOPE" --level "$LEVEL" --limit "$LIMIT" --dry-run
      - name: Make the audio
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SCOPE: ${{ inputs.scope }}
          LEVEL: ${{ inputs.level }}
          LIMIT: ${{ inputs.limit }}
          REDO: ${{ inputs.redo }}
          VOICE_F: ${{ inputs.voice_f }}
          VOICE_M: ${{ inputs.voice_m }}
        run: python3 tools/make-audio.py --scope "$SCOPE" --level "$LEVEL" --limit "$LIMIT" --redo "$REDO" --voice-f "$VOICE_F" --voice-m "$VOICE_M" --workers 2
      # B4: once the "Audio to R2" workflow has run (audio/r2.json exists), new recordings also go to the Cloudflare R2 bucket, which the site plays from.
      # After its "remove" step the files live only there: this step uploads them and the next one commits only the list.
      - name: Copy new recordings to the R2 bucket
        if: always() && hashFiles('audio/r2.json') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          aws s3 sync audio/ "s3://$R2_BUCKET/audio/" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --exclude '*' --include '*.mp3' --content-type audio/mpeg --cache-control 'public, max-age=86400' --size-only --only-show-errors
          touch "$RUNNER_TEMP/r2-ok"
      - name: Save the files and the list
        if: always()
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if python3 -c "import sys; sys.path.insert(0, 'tools'); import audiostore; sys.exit(0 if audiostore.only_remote() else 1)" && [ ! -f "$RUNNER_TEMP/r2-ok" ]; then
            echo "the upload to the R2 bucket failed, so the list is not saved (the site would point at files that are not there)"; exit 1; fi
          python3 tools/build-audio.py
          node tools/build-site.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio data/audio-manifest.js index.html sw.js
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Qwen audio: $SCOPE (made by the Qwen audio workflow)"
          git pull --rebase -q
          git push
