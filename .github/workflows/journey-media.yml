name: Journey photos

# Finds a Wikimedia Commons photo (via Wikipedia, Wikivoyage, Wikidata or a Commons search) for Journey stops (public domain, CC BY, CC BY-SA only) and saves them in data/journey-media.js.
# Run it by hand from the Actions tab. It skips stops it has already done, so it is safe to run again.
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Only this region (for example sichuan). Leave empty for all.'
        required: false
        default: ''
      limit:
        description: 'How many stops to look up in this run'
        required: false
        default: '3000'
      extra:
        description: 'Extra options for the lookup (for example --force, to ignore what was already searched)'
        required: false
        default: ''
      retry_misses:
        description: 'Try again the stops that had no usable photo last time'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up photos
        timeout-minutes: 32   # leaves time to save what was found even when Wikimedia is slow
        env:
          REGION: ${{ inputs.region }}
          LIMIT: ${{ inputs.limit }}
          RETRY: ${{ inputs.retry_misses }}
          EXTRA: ${{ inputs.extra }}
          JM_DEBUG: ${{ inputs.extra != '' && '1' || '' }}
        run: |
          args="--limit ${LIMIT:-400}"
          if [ -n "$REGION" ]; then args="$args --region $REGION"; fi
          if [ "$RETRY" = "true" ]; then args="$args --retry-misses"; fi
          node tools/journey-media.js $args $EXTRA
      - name: Rebuild the site files (cache stamps)
        if: always()
        run: node tools/build-site.js
      - name: Save the new photos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journey-media.js tools/journey-media-misses.json tools/journey-media-tried.json index.html sw.js
          if git diff --cached --quiet; then echo "Nothing new."; else git commit -m "Journey photos: add photos found on Wikimedia Commons" && git push; fi
