# Checks for Shanlu. Fast ones first (a few seconds), then the browser ones.
# The word/sentence content checks (tools/check-all.sh) need the HSK dataset, which lives outside this repository, so they are run by hand
# (see CONTENT-CHECKS.md) and are not part of this workflow.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'   # every morning: catches a browser or dependency update that breaks something while nobody pushed

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Stamp, unit tests, worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker
      # fails when a script, style or font changed but `node tools/build-site.js` was not run (stale version numbers, security policy or offline file list)
      - name: The version stamp is current
        run: node tools/build-site.js --check
      - name: Unit tests
        run: npm run test:unit
      - name: Worker tests (friends server, in a local Cloudflare simulator)
        run: npm run test:worker

  browser:
    name: Browser tests (${{ matrix.name }})
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One job per group, side by side: the five level suites run one after the other took longer than the time limit when they shared a job
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: friends, sync, offline copy
            run: node tools/smoke-test-friends.js && node tools/smoke-test-pwa.js && node tools/smoke-test-grv-variety.js
          - name: HSK 1
            run: node tools/smoke-test.js
          - name: HSK 2
            run: node tools/smoke-test-l2.js
          - name: HSK 3
            run: node tools/smoke-test-l3.js
          - name: HSK 4
            run: node tools/smoke-test-l4.js
          - name: HSK 5
            run: node tools/smoke-test-l5.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker   # the friends test needs the worker's own packages (it is skipped without them)
      - run: npx playwright install --with-deps chromium
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output-${{ strategy.job-index }}
          path: |
            /tmp/shanlu-*.png
          if-no-files-found: ignore
