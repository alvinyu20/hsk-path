name: Audio verify

# Listens to every recording with an open Chinese speech recogniser (FunASR paraformer-zh) and compares what it heard with the text we meant.
# Needs no key and costs nothing. Writes audio/verify.json; review/audio-check.html then shows the flagged ones first ("Checker flagged first").
# It cannot check tones and can be helped by sentence context, so "ok" is good news, not proof: see the top of tools/verify-audio.py.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Check at most this many (0 = all; try 20 first to see it works)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: qwen-audio

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install the recogniser
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet funasr modelscope pypinyin
      - name: Check the recordings
        env:
          LIMIT: ${{ inputs.limit }}
        run: python3 tools/verify-audio.py --limit "$LIMIT"
      - name: Save the result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/verify.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Audio verify: speech-recogniser check of the recordings (made by the Audio verify workflow)"
          git pull --rebase -q
          git push
