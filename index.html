          </div>
          <sc-if value="{{pairIdle}}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">Press play to hear a word.</p></sc-if>
          <sc-if value="{{pairAnswered}}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-weight:600">{{pairLine}} Press play for the next one.</p></sc-if>
          <sc-if value="{{hasPairStats}}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">{{pairStats}} this session</p></sc-if>
          </sc-if>
          <sc-if value="{{toneOne}}" hint-placeholder-val="{{ false }}">
          <h2 class="h2" style="font-size:28px">Which tone did you hear?</h2>
          <p class="muted" style="margin:0">One syllable, <i>ma</i>. Press play, then pick the tone. The real version would mix many different speakers.</p>
          <div class="dict-top">
            <button class="listen sm {{tonePlayCls}}" data-on-click="{{playTone}}" aria-label="Play a syllable">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            </button>
            <div class="tones">
              <sc-for list="{{toneOpts}}" as="t" hint-placeholder-count="4">
                <button class="tonebtn {{t.cls}}" data-on-click="{{t.fn}}"><b>{{t.py}}</b><span>{{t.label}}</span></button>
              </sc-for>
            </div>
          </div>
          <sc-if value="{{toneIdle}}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">Press play to hear a syllable.</p></sc-if>
          <sc-if value="{{toneAnswered}}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-weight:600">{{toneLine}} Press play for the next one.</p></sc-if>
          <sc-if value="{{hasToneStats}}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">{{toneStats}} this session</p></sc-if>
          </sc-if>
        </section>
      </sc-if>
    </div>

    <div class="sidep">
      <section class="card">
        <h2 class="h2">Your weak spots</h2>
        <p class="muted" style="margin:4px 0 8px;font-size:15px">Built from the words you miss in dictation.</p>
        <sc-for list="{{weak}}" as="w" hint-placeholder-count="3">
          <div class="scn"><div class="scn-m">{{w.t}}<span>{{w.d}}</span></div></div>
        </sc-for>
        <sc-if value="{{noWeak}}" hint-placeholder-val="{{ true }}"><p class="muted" style="margin:0;font-size:15px">Nothing yet. Words you miss in dictation will show up here.</p></sc-if>
      </section>
      <section class="card">
        <h2 class="h2">For real conversations</h2>
        <p class="muted" style="margin:4px 0 4px;font-size:15px">Two phrases for when someone talks too fast.</p>
        <sc-for list="{{phrases}}" as="p" hint-placeholder-count="2">
          <div class="ex">
            <div class="ex-m"><div class="zh">{{p.zh}}</div><div class="py">{{p.py}}</div><div>{{p.en}}</div></div>
            <button class="spk {{p.pc}}" aria-label="Hear this phrase" data-on-click="{{p.play}}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            </button>
          </div>
        </sc-for>
      </section>
    </div>
  </div>
  </sc-if>

  <!-- LEVEL EXAM -->
  <sc-if value="{{isExamNA}}" hint-placeholder-val="{{ false }}">
  <div class="lob"><section class="card"><h2 class="h2">{{examNaTitle}}</h2>
    <p class="muted" style="margin:6px 0 0;font-size:16px">{{examNaText}}</p>
    <div style="margin-top:16px"><button class="btn pri" data-on-click="{{goHome}}">Back to home</button></div></section></div>
  </sc-if>
  <sc-if value="{{isExam}}" hint-placeholder-val="{{ false }}">
  <sc-if value="{{exHome}}" hint-placeholder-val="{{ true }}">
  <div class="lob">
    <section class="card">
      <h2 class="h2">{{exTitle}}</h2>
      <p class="muted" style="margin:4px 0 14px;font-size:15.5px">{{exIntro}}</p>
      <div class="fmt">
        <div class="fmt-r"><div class="fmt-g zh" aria-hidden="true">听</div><div style="flex:1;min-width:0"><div class="fmt-t">{{exListenT}}</div><div class="fmt-d">{{exListenD}}</div></div></div>
        <div class="fmt-r"><div class="fmt-g zh" aria-hidden="true">读</div><div style="flex:1;min-width:0"><div class="fmt-t">{{exReadT}}</div><div class="fmt-d">{{exReadD}}</div></div></div>
        <sc-if value="{{examHasWriting}}" hint-placeholder-val="{{ false }}"><div class="fmt-r"><div class="fmt-g zh" aria-hidden="true">写</div><div style="flex:1;min-width:0"><div class="fmt-t">{{exWriteT}}</div><div class="fmt-d">{{exWriteD}}</div></div></div></sc-if>
      </div>
      <p class="plan-note">{{exNote}}</p>
      <sc-if value="{{examAvailable}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px">
        <button class="btn pri big" data-on-click="{{startFull}}">Start the full exam</button>
        <button class="btn big" data-on-click="{{startListening}}">Listening only</button>
        <button class="btn big" data-on-click="{{startReading}}">Reading only</button>
        <sc-if value="{{examHasWriting}}" hint-placeholder-val="{{ false }}"><button class="btn big" data-on-click="{{startWriting}}">Writing practice</button></sc-if>
      </div>
      </sc-if>
    </section>
    <section class="card">
      <h2 class="h2">How it is scored</h2>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">{{exScore}}</p>
      <h2 class="h2" style="margin-top:22px">Your last attempts</h2>
      <sc-if value="{{hasHist}}" hint-placeholder-val="{{ false }}">
        <div class="exhist"><sc-for list="{{histRows}}" as="r" hint-placeholder-count="3"><div class="exh-r"><div><b>{{r.text}}</b><span>{{r.detail}}</span></div><div class="exh-s">{{r.score}}</div></div></sc-for></div>
      </sc-if>
      <sc-if value="{{noHist}}" hint-placeholder-val="{{ true }}"><p class="muted" style="margin:8px 0 0">No attempts yet.</p></sc-if>
    </section>
  </div>
  </sc-if>

  <sc-if value="{{exRun}}" hint-placeholder-val="{{ false }}">
  <div class="exrun">
    <div class="ex-top">
      <div class="ex-sec"><span>{{exSection}}</span><b>Question {{exN}} of {{exTotal}}</b></div>
      <div class="ex-timer {{exTimerCls}}" role="timer" aria-label="Time left">{{exTimer}}</div>
    </div>
    <section class="card ex-card">
      <p class="ex-inst">{{exInst}}</p>
      <sc-if value="{{exListen}}" hint-placeholder-val="{{ false }}">
        <div class="ex-play">
          <button class="btn pri big {{exPlayCls}}" data-on-click="{{exPlay}}" aria-disabled="{{exPlayDis}}">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            Play
          </button>
          <span class="muted">{{exPlaysLeft}} plays left</span>
        </div>
      </sc-if>
      <sc-if value="{{exHasPic}}" hint-placeholder-val="{{ false }}"><div class="ex-pic" aria-hidden="true">{{exPic}}</div></sc-if>
      <sc-if value="{{exHasText}}" hint-placeholder-val="{{ false }}"><div class="zh ex-text">{{exText}}</div></sc-if>
      <sc-if value="{{exHasHint}}" hint-placeholder-val="{{ false }}"><div class="py ex-hint">{{exHint}}</div></sc-if>
      <sc-if value="{{exIsOrder}}" hint-placeholder-val="{{ false }}"><div class="ex-built-row"><div class="zh ex-built" aria-live="polite">{{exBuilt}}</div><button class="btn" data-on-click="{{exClear}}">Clear</button></div></sc-if>
      <sc-if value="{{exIsType}}" hint-placeholder-val="{{ false }}"><input id="ex-input" class="inp zh ex-input" type="text" value="{{exTypedVal}}" placeholder="Type the character" autocomplete="off" autocapitalize="off" aria-label="Your answer" data-on-input="{{exType}}"></sc-if>
      <div class="ex-opts {{exOptsCls}}" role="group" aria-label="Answers">
        <sc-for list="{{exOpts}}" as="o" hint-placeholder-count="3">
          <button class="ex-opt {{o.cls}}" data-on-click="{{o.pick}}"><b>{{o.letter}}</b><span class="{{o.big}}">{{o.label}}</span></button>
        </sc-for>
      </div>
    </section>
    <div class="ex-nav">
      <div class="ex-pal" role="group" aria-label="Questions"><sc-for list="{{exPal}}" as="p" hint-placeholder-count="20"><button class="{{p.cls}}" data-on-click="{{p.go}}">{{p.n}}</button></sc-for></div>
      <div class="ex-btns"><button class="btn" data-on-click="{{exPrev}}">Back</button><button class="btn pri" data-on-click="{{exNext}}">Next</button></div>
    </div>
    <sc-if value="{{hasConfirm}}" hint-placeholder-val="{{ false }}"><div class="banner" role="status">{{exConfirmMsg}}</div></sc-if>
    <div><button class="btn pri" data-on-click="{{exSubmit}}">{{exSubmitLabel}}</button></div>
  </div>
  </sc-if>

  <sc-if value="{{exBreak}}" hint-placeholder-val="{{ false }}">
  <div class="lob">
    <section class="card">
      <h2 class="h2">Listening is done</h2>
      <p class="muted" style="margin:6px 0 16px;font-size:16px">{{exBreakText}}</p>
      <button class="btn pri big" data-on-click="{{exContinue}}">Start Reading</button>
    </section>
  </div>
  </sc-if>

  <sc-if value="{{exResult}}" hint-placeholder-val="{{ false }}">
  <div class="exres">
    <section class="card">
      <h2 class="h2">Your result</h2>
      <sc-if value="{{exFull}}" hint-placeholder-val="{{ true }}">
        <div class="ex-total"><b>{{exTotal200}}</b><span>{{exVerdict}}</span></div>
      </sc-if>
      <sc-if value="{{exSingle}}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:6px 0 12px">{{exVerdict}}</p></sc-if>
      <div class="ex-secs">
        <sc-for list="{{exSecs}}" as="s" hint-placeholder-count="2">
          <div class="ex-sc {{s.cls}}"><div class="ex-sc-h"><b>{{s.name}}</b><span>{{s.text}} right · {{s.pts}}</span></div>
            <div class="ex-sc-p">{{s.pct}}</div>
            <div class="ex-parts"><sc-for list="{{s.parts}}" as="p" hint-placeholder-count="4"><span class="chip {{p.cls}}">{{p.name}} {{p.score}}</span></sc-for></div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{exSeal}}" hint-placeholder-val="{{ false }}"><div class="reward"><div class="stamp zh" style="width:56px;height:56px;font-size:34px;border-radius:10px;animation:none" aria-hidden="true">一</div><div><b>{{lvName}} seal earned.</b><div class="muted" style="font-size:15px">{{exSealText}}</div></div></div></sc-if>
      <sc-if value="{{exUnlock}}" hint-placeholder-val="{{ false }}"><div class="reward" style="margin-top:12px"><div style="flex:1;min-width:0"><b>{{exUnlockText}}</b></div><button class="btn pri" data-on-click="{{exUnlockGo}}">{{exUnlockGoText}}</button></div></sc-if>
      <sc-if value="{{exNoSeal}}" hint-placeholder-val="{{ true }}"><p class="muted" style="margin:14px 0 0">{{exSealText}}</p></sc-if>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px">
        <button class="btn pri" data-on-click="{{exAgain}}">Try another exam</button>
        <button class="btn" data-on-click="{{exClose}}">Back to the exam page</button>
      </div>
    </section>
    <sc-if value="{{hasWrong}}" hint-placeholder-val="{{ false }}">
    <section class="card">
      <h2 class="h2">What to review</h2>
      <p class="muted" style="margin:4px 0 12px;font-size:15.5px">Every question you missed, with the text of what you heard or read.</p>
      <div class="ex-wrong">
        <sc-for list="{{exWrong}}" as="w" hint-placeholder-count="3">
          <div class="exw">
            <div class="exw-h"><b>Question {{w.n}}</b><span>{{w.part}}</span></div>
            <sc-if value="{{w.hasPic}}" hint-placeholder-val="{{ false }}"><div class="exw-pic" aria-hidden="true">{{w.pic}}</div></sc-if>
            <div class="zh exw-zh">{{w.zh}}</div>
            <div class="py">{{w.py}}</div>
            <div>{{w.en}}</div>
            <div class="exw-a"><span class="good">Right answer: {{w.right}}</span><span class="bad">You chose: {{w.yours}}</span></div>
          </div>
        </sc-for>
      </div>
    </section>
    </sc-if>
    <sc-if value="{{perfect}}" hint-placeholder-val="{{ false }}"><section class="card"><h2 class="h2">No mistakes</h2><p class="muted" style="margin:6px 0 0">Every question was right.</p></section></sc-if>
  </div>
  </sc-if>
  </sc-if>

  <!-- QUIZ (tests and grammar practice) -->
  <sc-if value="{{isQuiz}}" hint-placeholder-val="{{ false }}">
  <div class="quiz">
    <sc-if value="{{inQuestions}}" hint-placeholder-val="{{ true }}">
      <div class="q-top">
        <button class="btn" data-on-click="{{exitQuiz}}">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          Exit
        </button>
        <div class="segs">
          <sc-for list="{{segs}}" as="s" hint-placeholder-count="5"><span class="seg {{s.cls}}"></span></sc-for>
        </div>
        <span class="chip combo {{comboCls}}">Combo ×{{qcombo}}</span>
      </div>

      <sc-if value="{{hasGlast}}" hint-placeholder-val="{{ false }}"><div class="delta {{glastCls}}">{{glastText}}</div></sc-if>
      <div class="q-card {{qAnim}}">
        <div class="kick">{{q.kicker}}</div>
        <h2 class="q-prompt">{{q.prompt}}</h2>

        <sc-if value="{{q.hasBig}}" hint-placeholder-val="{{ true }}"><div class="zh q-big {{q.bigCls}}">{{q.big}}</div></sc-if>
        <sc-if value="{{q.hasSub}}" hint-placeholder-val="{{ false }}"><div class="q-sub">{{q.sub}}</div></sc-if>

        <sc-if value="{{q.isTyped}}" hint-placeholder-val="{{ true }}">
          <input id="answer-input" class="inp {{inpCls}}" type="text" value="{{qtyped}}" placeholder="{{q.placeholder}}" autocomplete="off" aria-label="Your answer" data-on-input="{{onType}}" data-on-keydown="{{onEnter}}">
        </sc-if>

        <sc-if value="{{q.isListen}}" hint-placeholder-val="{{ false }}">
          <button class="listen {{listenCls}}" data-on-click="{{playQ}}" aria-label="Play the word">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          </button>
        </sc-if>

        <sc-if value="{{q.isChoice}}" hint-placeholder-val="{{ false }}">
          <div class="opts {{optsCls}}">
            <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
              <button class="opt {{o.cls}}" data-on-click="{{o.pick}}"><span class="{{o.lcls}}">{{o.label}}</span></button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{q.isOrder}}" hint-placeholder-val="{{ false }}">
          <div class="ans-line">
            <sc-for list="{{pickedTiles}}" as="t" hint-placeholder-count="0"><button class="tile zh {{t.cls}}" data-on-click="{{t.fn}}">{{t.label}}</button></sc-for>
            <sc-if value="{{noPicked}}" hint-placeholder-val="{{ true }}"><span class="ans-ph">Tap the words below in order</span></sc-if>
          </div>
          <div class="bank">
            <sc-for list="{{bankTiles}}" as="t" hint-placeholder-count="4"><button class="tile zh {{t.cls}}" data-on-click="{{t.fn}}">{{t.label}}</button></sc-for>
          </div>
        </sc-if>

        <sc-if value="{{q.isSpot}}" hint-placeholder-val="{{ false }}">
          <div class="spot">
            <sc-for list="{{spotTokens}}" as="t" hint-placeholder-count="5">
              <sc-if value="{{t.isTok}}" hint-placeholder-val="{{ true }}"><button class="tok zh {{t.cls}}" data-on-click="{{t.pick}}">{{t.label}}</button></sc-if>
              <sc-if value="{{t.isPunct}}" hint-placeholder-val="{{ false }}"><span class="punct zh">{{t.label}}</span></sc-if>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{hasQerr}}" hint-placeholder-val="{{ false }}"><div class="fb-x" role="alert" style="align-self:flex-end;max-width:520px">{{qerr}}</div></sc-if>
        <button class="btn pri big {{checkCls}}" style="align-self:flex-end" aria-disabled="{{checkAria}}" data-on-click="{{check}}">{{checkLabel}}</button>
      </sc-if>
      <sc-if value="{{qchecked}}" hint-placeholder-val="{{ false }}">
        <div class="fb {{fbCls}}">
          <div class="fb-ic">
            <sc-if value="{{qcorrect}}" hint-placeholder-val="{{ true }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
            <sc-if value="{{qwrong}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></sc-if>
          </div>
          <div class="fb-m">
            <div class="fb-t">{{fbTitle}}</div>
            <sc-if value="{{hasQfeed}}" hint-placeholder-val="{{ false }}"><div class="fb-x">{{qfeed}}</div></sc-if>
            <div class="fb-s zh">{{q.reveal}}</div>
            <div class="fb-x">{{q.explain}}</div>
            <a class="report" href="{{q.reportUrl}}" target="_blank" rel="noopener">Report a mistake</a>
          </div>
          <button class="btn ink big" data-on-click="{{next}}">{{nextLabel}}</button>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{qdone}}" hint-placeholder-val="{{ false }}">
      <div class="res">
        <div class="stamp zh" aria-hidden="true">好</div>
        <h2 class="res-h">{{resTitle}}</h2>
        <p class="res-p">{{resSub}}</p>
        <div class="res-stats">
          <div class="stat"><b>{{resScore}}</b><span>Correct</span></div>
          <div class="stat"><b>{{qbest}}</b><span>Best combo</span></div>
          <div class="stat"><b>{{memWords}}</b><span>words in memory</span></div>
        </div>
        <span class="res-gain">{{resGain}}</span>
        <div class="res-act">
          <button class="btn pri big" data-on-click="{{again}}">Go again</button>
          <button class="btn big" data-on-click="{{goHome}}">Back to home</button>
        </div>
      </div>
    </sc-if>
  </div>
  </sc-if>

  <footer class="foot">
    <p>The Chinese on this site is checked by AI against a community HSK word list and has not been reviewed by a teacher yet. If something looks wrong, use "Report a mistake" next to it.</p>
    <div class="foot-act">
      <button class="linkbtn" data-on-click="{{goVoice}}">Settings</button>
      <button class="linkbtn" data-on-click="{{exportData}}">Export progress</button>
      <button class="linkbtn" data-on-click="{{importData}}">Import progress</button>
      <button class="linkbtn" data-on-click="{{resetAll}}">Reset progress</button>
      <a class="linkbtn" href="{{repoUrl}}" target="_blank" rel="noopener">Source on GitHub</a>
    </div>
  </footer>
</main>
</div>
</template>
