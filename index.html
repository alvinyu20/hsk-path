<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shanlu · HSK study path</title>
<meta name="description" content="A personal HSK study site: word webs, flashcards, listening practice and grammar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23C2362B'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' fill='white' font-family='serif'%3E山%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Source+Sans+3:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This site needs JavaScript to run.</p></noscript>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<template id="app-template">

<div class="app {{themeCls}} {{focusCls}}">

<aside class="side">
  <div class="brand">
    <div class="mark zh" aria-hidden="true">山</div>
    <div><div class="bname">Shanlu</div><div class="bsub">HSK study path</div></div>
  </div>

  <nav class="navs" aria-label="Main">
    <button class="{{navHome}}" onClick="{{goHome}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
      Home
    </button>
    <button class="{{navWeb}}" onClick="{{goWeb}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M10 10.5 6.5 7.5M14 10.5l3.5-3M10 13.5 6.5 16.5M14 13.5l3.5 3"/></svg>
      Word webs
    </button>
    <button class="{{navReview}}" onClick="{{goReview}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12" rx="2.5"/><path d="M7 3.8h10"/></svg>
      Review words
      <sc-if value="{{hasDue}}" hint-placeholder-val="{{ true }}"><span class="badge">{{dueCount}}</span></sc-if>
    </button>
    <button class="{{navWords}}" onClick="{{goWords}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      My words
    </button>
    <button class="{{navTest}}" onClick="{{goTest}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
      Tests
    </button>
    <button class="{{navGrammar}}" onClick="{{goGrammar}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>
      Grammar
    </button>
    <button class="{{navListen}}" onClick="{{goListen}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
      Listening lab
    </button>
    <button class="{{navSpeak}}" onClick="{{goSpeak}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
      Speak
    </button>
    <button class="{{navExam}}" onClick="{{goExam}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l6-10 4 6 2-3 6 7z"/><path d="M14 6l1.5-2.5L17 6"/></svg>
      Level exam
    </button>
  </nav>

  <div class="streak">
    <div class="streak-h">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.1 3.4 5 5.3 5 9.9a5 5 0 0 1-10 0c0-1.8.8-3 1.8-4.1.2 1.6 1.1 2.5 2.1 2.7C10.3 8.5 11 5.5 12 2.5z"/></svg>
      <span>{{streak}}-day streak</span>
    </div>
    <div class="week" aria-label="This week">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7"><span class="{{d.cls}}">{{d.l}}</span></sc-for>
    </div>
  </div>

  <div class="me">
    <div class="me-av zh" aria-hidden="true">学</div>
    <div><b>Your progress</b><div class="bsub">HSK 1 · {{overall}}% to checkpoint</div></div>
  </div>
  <button class="linkbtn" onClick="{{toggleTheme}}">{{themeLabel}}</button>
</aside>

<main class="main">
  <header class="top">
    <div>
      <h1 class="h1">{{title}}</h1>
      <p class="sub">{{subtitle}}</p>
    </div>
    <div class="stats">
      <span class="pill fl"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.1 3.4 5 5.3 5 9.9a5 5 0 0 1-10 0c0-1.8.8-3 1.8-4.1.2 1.6 1.1 2.5 2.1 2.7C10.3 8.5 11 5.5 12 2.5z"/></svg>{{streakText}}</span>
      <span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z"/></svg>{{xpText}} XP</span>
    </div>
  </header>
  <sc-if value="{{noVoice}}" hint-placeholder-val="{{ false }}"><div class="banner">This browser does not report a Chinese voice, so audio may be silent or sound wrong. Try Chrome or Safari, or check your device's text-to-speech language settings. <button class="linkbtn" onClick="{{goVoice}}">Open voice settings</button></div></sc-if>

  <!-- VOICE -->
  <sc-if value="{{isVoice}}" hint-placeholder-val="{{ false }}">
  <div class="vscreen">
    <section class="card" style="margin-bottom:20px">
      <h2 class="h2">Sync across devices</h2>
      <sc-if value="{{syncOff}}" hint-placeholder-val="{{ true }}">
        <p class="muted" style="margin:6px 0 0;font-size:16px">Your progress is saved in this browser only. To use the same progress on your phone and your computer, keep one private copy in a GitHub gist. You do this once per device.</p>
        <ol class="muted" style="margin:10px 0 0;padding-left:20px;font-size:15.5px;line-height:1.6">
          <li>Open <a href="{{syncTokenUrl}}" target="_blank" rel="noopener">this GitHub page</a> (sign in if asked). It makes a classic token with only the gist permission. Pick an expiry you are comfortable with, then press Generate token.</li>
          <li>Copy the token (it starts with ghp_) and paste it below.</li>
          <li>Press Connect. Do the same on your other devices with the same token.</li>
        </ol>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <input class="wsearch" type="password" autocomplete="off" placeholder="Paste the token" value="{{syncInput}}" onInput="{{onSyncInput}}" style="flex:1 1 220px;min-width:0" aria-label="GitHub token">
          <button class="btn pri" onClick="{{syncConnect}}">Connect</button>
        </div>
        <p class="muted" style="margin:10px 0 0;font-size:14.5px">The token is kept on this device only, never in your exported progress. It can only read and write gists. You can delete it any time at github.com/settings/tokens.</p>
      </sc-if>
      <sc-if value="{{syncOn}}" hint-placeholder-val="{{ false }}">
        <p class="muted" style="margin:6px 0 0;font-size:16px">{{syncAtText}} Progress syncs when you open the site, when you come back to the tab, and shortly after you study.</p>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <button class="btn pri" onClick="{{syncNow}}">Sync now</button>
          <button class="btn" onClick="{{syncDisconnect}}">Disconnect this device</button>
        </div>
      </sc-if>
      <sc-if value="{{hasSyncMsg}}" hint-placeholder-val="{{ false }}"><div class="banner {{syncMsgCls}}" style="margin-top:14px" role="status">{{syncMsg}}</div></sc-if>
    </section>
    <section class="card" style="margin-bottom:20px">
      <h2 class="h2">AI conversation (optional)</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">Speaking practice with a real conversation partner: you speak or type, Mingming answers in simple Chinese and tells you what was not natural. It uses the Claude API, which is billed separately from a Claude.ai subscription: create a key at console.anthropic.com and add some credit there. Each message costs only a small fraction of a cent on the cheaper model, but I could not look up current prices from here, so check them on that site.</p>
      <p class="muted" style="margin:10px 0 0;font-size:14.5px">The key is stored on this device only. It is sent straight from your browser to Anthropic and is not synced or exported. Anyone who can use this browser can use the key, so set a spending limit on the key's account.</p>
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{aiModelOpts}}" as="m" hint-placeholder-count="2"><button class="fc2 {{m.cls}}" onClick="{{m.fn}}">{{m.label}}</button></sc-for>
      </div>
      <sc-if value="{{aiUnset}}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <input class="wsearch" style="margin:0;flex:1 1 220px;min-width:0" type="password" autocomplete="off" placeholder="Paste the API key" value="{{aiKeyInput}}" onInput="{{onAiKeyInput}}" aria-label="Anthropic API key">
          <button class="btn pri" onClick="{{aiSaveKey}}">Save key</button>
        </div>
      </sc-if>
      <sc-if value="{{aiSet}}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span class="muted">A key is saved on this device.</span><button class="btn" onClick="{{aiRemoveKey}}">Remove the key</button></div>
      </sc-if>
      <sc-if value="{{hasAiNote}}" hint-placeholder-val="{{ false }}"><div class="banner" style="margin-top:12px" role="status">{{aiNote}}</div></sc-if>
    </section>
    <section class="card">
      <h2 class="h2">Chinese voice</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">{{voiceIntro}}</p>
      <p class="muted" style="margin:10px 0 0;font-size:15.5px">On iPhone, download an Enhanced or Premium voice in Settings, Accessibility, Read &amp; Speak, Voices (it is called Spoken Content on older versions), then come back here and tap Refresh. Voices named Siri may not be offered to websites at all. If a voice you downloaded is missing from this list, your browser is not passing it on to websites.</p>
      <div class="vlist">
        <div class="vrow {{autoCls}}">
          <div><b>{{autoName}}</b><span>Picks the highest-quality Mandarin voice, then prefers mainland over Taiwan</span></div>
          <div class="vact"><button class="fc2 {{autoPlayCls}}" onClick="{{autoPlay}}">Play</button><button class="fc2 {{autoCls}}" onClick="{{useAuto}}">{{autoLabel}}</button></div>
        </div>
        <sc-for list="{{voiceRows}}" as="v" hint-placeholder-count="3">
          <div class="vrow {{v.cls}}">
            <div><b>{{v.name}}</b><span>{{v.meta}}</span></div>
            <div class="vact"><button class="fc2 {{v.playCls}}" onClick="{{v.play}}">Play</button><button class="fc2 {{v.useCls}}" onClick="{{v.use}}">{{v.useLabel}}</button></div>
          </div>
        </sc-for>
      </div>
      <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <button class="btn pri" onClick="{{refreshVoices}}">Refresh</button>
        <button class="btn" onClick="{{goHome}}">Back to home</button>
        <button class="linkbtn" onClick="{{toggleAllVoices}}">{{allVoicesBtn}}</button>
      </div>
      <sc-if value="{{showAllVoices}}" hint-placeholder-val="{{ false }}">
        <ul class="vall"><sc-for list="{{everyVoice}}" as="e" hint-placeholder-count="3"><li>{{e.line}}</li></sc-for></ul>
      </sc-if>
    </section>
    <sc-if value="{{erhuaAvailable}}" hint-placeholder-val="{{ true }}">
    <section class="card" style="margin-top:20px">
      <h2 class="h2">儿 endings</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">In the northern, Beijing style, some words end in 儿: 面条儿, 一点儿, 这儿, 哪儿. Many speakers, especially in the south and in Taiwan, say 面条, 一点, 这里 and 哪里 instead. This site uses the plain forms unless you switch.</p>
      <p class="muted" style="margin:10px 0 0;font-size:15.5px">The official HSK 1 word list prints the 儿 forms, so you may still meet them on the exam. Switching reloads the page. Your progress on these words carries over. With plain forms on, 这儿, 那儿 and 哪儿 are left out, because 这里, 那里 and 哪里 are already on the list.</p>
      <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <button class="btn pri" onClick="{{toggleErhua}}">{{erhuaBtn}}</button>
        <span class="muted">{{erhuaNow}}</span>
      </div>
    </section>
    </sc-if>
  </div>
  </sc-if>

  <!-- HOME -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
  <div class="hgrid">
    <section class="card">
      <div class="today-h">
        <div class="ring">
          <svg viewBox="0 0 110 110" aria-hidden="true">
            <circle class="ring-bg" cx="55" cy="55" r="46"></circle>
            <circle class="ring-fg" cx="55" cy="55" r="46" transform="rotate(-90 55 55)" style="stroke-dasharray: {{ringDash}}"></circle>
          </svg>
          <div class="ring-t"><b>{{dayMin}}</b><span>of {{mins}} min</span></div>
        </div>
        <div>
          <h2 class="h2">Today's climb</h2>
          <p class="muted" style="margin:6px 0 0;font-size:16px">{{todayLine}}</p>
        </div>
      </div>
      <div class="goalrow">
        <span class="muted">Daily time goal</span>
        <div class="seg2" role="group" aria-label="Daily time goal">
          <sc-for list="{{minOpts}}" as="o" hint-placeholder-count="4"><button class="{{o.cls}}" onClick="{{o.fn}}">{{o.label}}</button></sc-for>
        </div>
      </div>
      <div class="tasks">
        <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
          <div class="task {{t.cls}}">
            <div class="task-ico zh">{{t.glyph}}</div>
            <div class="task-m">
              <div class="task-t">{{t.title}}</div>
              <div class="task-s">{{t.meta}}</div>
            </div>
            <sc-if value="{{t.open}}" hint-placeholder-val="{{ true }}">
              <span class="xpc">{{t.xp}}</span>
              <button class="btn ink" onClick="{{t.go}}">Start</button>
            </sc-if>
            <sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}">
              <span class="xpc">Done</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <p class="plan-note">{{planNote}}</p>
    </section>

    <section class="card">
      <h2 class="h2">HSK 1 checkpoint</h2>
      <p class="cp-note">Reach 80% in all four skills to unlock the checkpoint.</p>
      <div class="skills">
        <sc-for list="{{skills}}" as="s" hint-placeholder-count="4">
          <div>
            <div class="skill-h">{{s.label}}<span>{{s.detail}}</span></div>
            <div class="track"><div class="fill" style="width: {{s.w}}"></div><div class="m80"></div></div>
          </div>
        </sc-for>
      </div>
      <div class="skill-h">Words by memory strength<span>{{wmTotal}} of {{wordTarget}}</span></div>
      <div class="stack">
        <i class="s1" style="width: {{wMastered}}"></i><i class="s2" style="width: {{wFamiliar}}"></i><i class="s3" style="width: {{wLearning}}"></i>
      </div>
      <div class="legend">
        <span><i class="s1"></i>{{wm.mastered}} mastered</span>
        <span><i class="s2"></i>{{wm.familiar}} familiar</span>
        <span><i class="s3"></i>{{wm.learning}} learning</span>
      </div>
      <button class="btn" style="margin-top:14px;min-height:42px" onClick="{{goWords}}">See every word</button>
      <div style="margin-top:22px">
        <button class="btn big" onClick="{{goExam}}">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
          See the HSK 1 level exam
        </button>
      </div>
    </section>
  </div>

  <section>
    <div class="asc-h">
      <div>
        <h2 class="h2">The ascent</h2>
        <p class="muted" style="margin:4px 0 0;font-size:16px">Pass each checkpoint to climb to the next level.</p>
      </div>
      <div class="seg2" role="group" aria-label="HSK version">
        <button class="{{sys2Cls}}" onClick="{{setSys2}}">HSK 2.0 · 6 levels</button>
        <button class="{{sys3Cls}}" onClick="{{setSys3}}">HSK 3.0 · 9 levels</button>
      </div>
    </div>
    <div class="stairs">
      <sc-for list="{{stairs}}" as="s" hint-placeholder-count="6">
        <div class="step">
          <sc-if value="{{s.isCur}}" hint-placeholder-val="{{ false }}">
            <span class="flagpill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 5h11l-2.5 3.5L17 12H6"/></svg>You are here</span>
          </sc-if>
          <div class="blk {{s.cls}}" style="height: {{s.h}}">
            <div class="bf" style="height: {{s.fillH}}"></div>
            <sc-if value="{{s.isLock}}" hint-placeholder-val="{{ true }}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
            </sc-if>
            <div class="blk-n">{{s.label}}</div>
            <div class="blk-w">{{s.words}}</div>
            <div class="blk-s">{{s.status}}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <p class="asc-note">{{sysNote}}</p>
  </section>
  </sc-if>

  <!-- REVIEW -->
  <sc-if value="{{isReview}}" hint-placeholder-val="{{ false }}">
  <div class="rev">
    <sc-if value="{{inReview}}" hint-placeholder-val="{{ true }}">
      <div class="rev-top">
        <div class="pbar"><i style="width: {{rPct}}"></i></div>
        <span class="rev-n">{{rdone}} of {{rtotal}}</span>
        <span class="chip familiar">+{{rxp}} XP</span>
      </div>
      <sc-if value="{{hasRlast}}" hint-placeholder-val="{{ false }}"><div class="delta {{rlastCls}}">{{rlastText}}</div></sc-if>

      <div class="fc-wrap {{cardAnim}}">
        <div class="fc-inner {{flipCls}}">
          <div class="fc-face fc-front">
            <span class="chip {{card.stage}}">{{card.stageLabel}}</span>
            <svg class="tian" viewBox="0 0 200 200" aria-hidden="true">
              <rect x="2" y="2" width="196" height="196" rx="8" fill="none" stroke="currentColor" stroke-width="2"></rect>
              <path d="M100 2v196M2 100h196" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 7"></path>
            </svg>
            <div class="zh fc-hz {{card.sizeCls}}">{{card.zh}}</div>
            <div class="fc-tip">Say it out loud, then tap to check</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-bh"><span class="zh">{{card.zh}}</span><span class="chip {{card.stage}}">{{card.stageLabel}}</span></div>
            <div class="fc-py">{{card.py}}</div>
            <div class="fc-en">{{card.en}}</div>
            <div class="mbar">
              <div class="mbar-h"><span>{{card.mLabel}}</span><b>{{card.mPct}}</b></div>
              <div class="track sm"><div class="fill {{card.mCls}}" style="width: {{card.mW}}"></div><i class="tk" style="left:30%"></i><i class="tk" style="left:55%"></i><i class="tk" style="left:80%"></i></div>
              <div class="mbar-s"><span>{{card.recallText}}</span><span class="{{card.dueCls}}">{{card.due}}</span></div>
            </div>
            <div class="exbox">
              <div class="zh">{{card.exZh}}</div>
              <div class="py">{{card.exPy}}</div>
              <div class="en">{{card.exEn}}</div>
              <sc-if value="{{card.hasNote}}" hint-placeholder-val="{{ false }}"><div class="exnote">{{card.note}}</div></sc-if>
              <a class="report" href="{{card.reportUrl}}" target="_blank" rel="noopener">Report a mistake</a>
            </div>
          </div>
        </div>
        <button class="fc-hit" onClick="{{flip}}" aria-label="{{flipLabel}}"></button>
      </div>

      <div class="acts">
        <button class="btn {{playWordCls}}" onClick="{{playWord}}">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          Hear the word
        </button>
        <sc-if value="{{rflip}}" hint-placeholder-val="{{ false }}">
          <button class="btn {{playExCls}}" onClick="{{playEx}}">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            Hear the sentence
          </button>
        </sc-if>
      </div>

      <sc-if value="{{showAnswerBtn}}" hint-placeholder-val="{{ true }}">
        <button class="btn pri big" style="align-self:center" onClick="{{flip}}">Show answer</button>
      </sc-if>
      <sc-if value="{{rflip}}" hint-placeholder-val="{{ false }}">
        <div class="rates">
          <sc-for list="{{rates}}" as="r" hint-placeholder-count="4">
            <button class="rate {{r.cls}}" onClick="{{r.fn}}"><b>{{r.label}}</b><span>{{r.hint}}</span></button>
          </sc-for>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{emptyNew}}" hint-placeholder-val="{{ false }}">
      <div class="res">
        <div class="stamp zh" aria-hidden="true">词</div>
        <h2 class="res-h">Nothing to review yet</h2>
        <p class="res-p">Reviews start once you have learned some words. Meet your first words in Word webs.</p>
        <div class="res-act"><button class="btn pri big" onClick="{{goWeb}}">Go to Word webs</button></div>
      </div>
    </sc-if>
    <sc-if value="{{moreDue}}" hint-placeholder-val="{{ false }}">
      <div class="res">
        <div class="stamp zh" aria-hidden="true">词</div>
        <h2 class="res-h">More words are due</h2>
        <p class="res-p">{{dueLeftText}} Reviewing them now keeps them from fading. Reviews come in rounds of 30.</p>
        <div class="res-act"><button class="btn pri big" onClick="{{reviewMore}}">{{moreDueText}}</button></div>
      </div>
    </sc-if>
    <sc-if value="{{caughtUp}}" hint-placeholder-val="{{ false }}">

  <!-- SPEAK -->

            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>

    <div class="sidep">

  </div>

  <sc-if value="{{aiModeOn}}" hint-placeholder-val="{{ false }}">

        <div class="chat-t"><b>Mingming</b><span>AI conversation · {{aiToday}}</span></div>
        <div class="seg2" role="group" aria-label="Show on screen">
          <button class="{{zhCls}}" onClick="{{toggleZh}}">Characters</button>
          <button class="{{pyCls}}" onClick="{{togglePy}}">Pinyin</button>
          <button class="{{enCls}}" onClick="{{toggleEn}}">English</button>
        </div>
      </div>
      <div class="msgs">
        <sc-for list="{{aiMsgs}}" as="m" hint-placeholder-count="3">

            <div class="bub {{m.who}}">
              <div>
                <sc-if value="{{m.showZh}}" hint-placeholder-val="{{ true }}"><div class="zh">{{m.zh}}</div></sc-if>
                <sc-if value="{{m.quiet}}" hint-placeholder-val="{{ false }}"><div class="muted-b">{{m.quietText}}</div></sc-if>
                <sc-if value="{{m.showPy}}" hint-placeholder-val="{{ true }}"><div class="py">{{m.py}}</div></sc-if>

    <div class="sidep">

      <section class="card">
        <h2 class="h2">For real conversations</h2>
        <p class="muted" style="margin:4px 0 4px;font-size:15px">Two phrases for when someone talks too fast.</p>
        <sc-for list="{{phrases}}" as="p" hint-placeholder-count="2">
          <div class="ex">
            <div class="ex-m"><div class="zh">{{p.zh}}</div><div class="py">{{p.py}}</div><div>{{p.en}}</div></div>
            <button class="spk {{p.pc}}" aria-label="Hear this phrase" onClick="{{p.play}}">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            </button>
          </div>
        </sc-for>
      </section>
    </div>
  </div>
  </sc-if>

  <!-- LEVEL EXAM -->
  <sc-if value="{{isExam}}" hint-placeholder-val="{{ false }}">
  <sc-if value="{{exHome}}" hint-placeholder-val="{{ true }}">
  <div class="lob">
    <section class="card">
      <h2 class="h2">HSK 1 mock exam</h2>
      <p class="muted" style="margin:4px 0 14px;font-size:15.5px">Built like the official HSK 1 sample papers: 20 listening and 20 reading questions in four parts each, about 35 minutes. No hints and no pinyin while you answer. Each exam is drawn from a bank of 120+ questions, so it is different every time.</p>
      <div class="fmt">
        <div class="fmt-r"><div class="fmt-g zh" aria-hidden="true">听</div><div style="flex:1;min-width:0"><div class="fmt-t">Listening · 20 questions · 15 min</div><div class="fmt-d">Part 1: does the picture match? Part 2: pick the picture for a sentence. Part 3: match five conversations to pictures. Part 4: a conversation, a question, three answers. Each clip can be played twice.</div></div></div>
        <div class="fmt-r"><div class="fmt-g zh" aria-hidden="true">读</div><div style="flex:1;min-width:0"><div class="fmt-t">Reading · 20 questions · 20 min</div><div class="fmt-d">Part 1: does the picture match the words? Part 2: match five sentences to pictures. Part 3: match five questions to answers. Part 4: fill five blanks from a word list.</div></div></div>
      </div>
      <p class="plan-note">The real test has pictures; here emoji stand in for them. The official 2025 test is said to have 20 listening questions (about 12 minutes of audio) and 20 reading questions (20 minutes); the part-by-part layout above is from the official sample papers and I could not confirm every detail of the 2025 version. Listening gets 15 minutes here because you press play yourself.</p>
      <sc-if value="{{examAvailable}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px">
        <button class="btn pri big" onClick="{{startFull}}">Start the full exam</button>
        <button class="btn big" onClick="{{startListening}}">Listening only</button>
        <button class="btn big" onClick="{{startReading}}">Reading only</button>
      </div>
      </sc-if>
    </section>
    <section class="card">
      <h2 class="h2">How it is scored</h2>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">Each question is worth 5 points, so each section is out of 100 and the total out of 200. The official HSK 1 pass mark is 120 of 200 (I am not sure whether the 2025 version changed it). This site's HSK 1 seal is stricter: 80% in every section.</p>
      <h2 class="h2" style="margin-top:22px">Your last attempts</h2>
      <sc-if value="{{hasHist}}" hint-placeholder-val="{{ false }}">
        <div class="exhist"><sc-for list="{{histRows}}" as="r" hint-placeholder-count="3"><div class="exh-r"><div><b>{{r.text}}</b><span>{{r.detail}}</span></div><div class="exh-s">{{r.score}}</div></div></sc-for></div>
      </sc-if>
      <sc-if value="{{noHist}}" hint-placeholder-val="{{ true }}"><p class="muted" style="margin:8px 0 0">No attempts yet.</p></sc-if>
    </section>
  </div>
  </sc-if>

  <sc-if value="{{exRun}}" hint-placeholder-val="{{ false }}">
  <div class="exrun">
    <div class="ex-top">
      <div class="ex-sec"><span>{{exSection}}</span><b>Question {{exN}} of {{exTotal}}</b></div>
      <div class="ex-timer {{exTimerCls}}" role="timer" aria-label="Time left">{{exTimer}}</div>
    </div>
    <section class="card ex-card">
      <p class="ex-inst">{{exInst}}</p>
      <sc-if value="{{exListen}}" hint-placeholder-val="{{ false }}">
        <div class="ex-play">
          <button class="btn pri big {{exPlayCls}}" onClick="{{exPlay}}" aria-disabled="{{exPlayDis}}">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
            Play
          </button>
          <span class="muted">{{exPlaysLeft}} plays left</span>
        </div>
      </sc-if>
      <sc-if value="{{exHasPic}}" hint-placeholder-val="{{ false }}"><div class="ex-pic" aria-hidden="true">{{exPic}}</div></sc-if>
      <sc-if value="{{exHasText}}" hint-placeholder-val="{{ false }}"><div class="zh ex-text">{{exText}}</div></sc-if>
      <div class="ex-opts {{exOptsCls}}" role="group" aria-label="Answers">
        <sc-for list="{{exOpts}}" as="o" hint-placeholder-count="3">
          <button class="ex-opt {{o.cls}}" onClick="{{o.pick}}"><b>{{o.letter}}</b><span class="{{o.big}}">{{o.label}}</span></button>
        </sc-for>
      </div>
    </section>
    <div class="ex-nav">
      <div class="ex-pal" role="group" aria-label="Questions"><sc-for list="{{exPal}}" as="p" hint-placeholder-count="20"><button class="{{p.cls}}" onClick="{{p.go}}">{{p.n}}</button></sc-for></div>
      <div class="ex-btns"><button class="btn" onClick="{{exPrev}}">Back</button><button class="btn pri" onClick="{{exNext}}">Next</button></div>
    </div>
    <sc-if value="{{hasConfirm}}" hint-placeholder-val="{{ false }}"><div class="banner" role="status">{{exConfirmMsg}}</div></sc-if>
    <div><button class="btn pri" onClick="{{exSubmit}}">{{exSubmitLabel}}</button></div>
  </div>
  </sc-if>

  <sc-if value="{{exBreak}}" hint-placeholder-val="{{ false }}">
  <div class="lob">
    <section class="card">
      <h2 class="h2">Listening is done</h2>
      <p class="muted" style="margin:6px 0 16px;font-size:16px">{{exBreakText}}</p>
      <button class="btn pri big" onClick="{{exContinue}}">Start Reading</button>
    </section>
  </div>
  </sc-if>

  <sc-if value="{{exResult}}" hint-placeholder-val="{{ false }}">
  <div class="exres">
    <section class="card">
      <h2 class="h2">Your result</h2>
      <sc-if value="{{exFull}}" hint-placeholder-val="{{ true }}">
        <div class="ex-total"><b>{{exTotal200}}</b><span>{{exVerdict}}</span></div>
      </sc-if>
      <sc-if value="{{exSingle}}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:6px 0 12px">{{exVerdict}}</p></sc-if>
      <div class="ex-secs">
        <sc-for list="{{exSecs}}" as="s" hint-placeholder-count="2">
          <div class="ex-sc {{s.cls}}"><div class="ex-sc-h"><b>{{s.name}}</b><span>{{s.text}} right · {{s.pts}}</span></div>
            <div class="ex-sc-p">{{s.pct}}</div>
            <div class="ex-parts"><sc-for list="{{s.parts}}" as="p" hint-placeholder-count="4"><span class="chip {{p.cls}}">{{p.name}} {{p.score}}</span></sc-for></div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{exSeal}}" hint-placeholder-val="{{ false }}"><div class="reward"><div class="stamp zh" style="width:56px;height:56px;font-size:34px;border-radius:10px;animation:none" aria-hidden="true">一</div><div><b>HSK 1 seal earned.</b><div class="muted" style="font-size:15px">{{exSealText}}</div></div></div></sc-if>
      <sc-if value="{{exNoSeal}}" hint-placeholder-val="{{ true }}"><p class="muted" style="margin:14px 0 0">{{exSealText}}</p></sc-if>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px">
        <button class="btn pri" onClick="{{exAgain}}">Try another exam</button>
        <button class="btn" onClick="{{exClose}}">Back to the exam page</button>
      </div>
    </section>
    <sc-if value="{{hasWrong}}" hint-placeholder-val="{{ false }}">
    <section class="card">
      <h2 class="h2">What to review</h2>
      <p class="muted" style="margin:4px 0 12px;font-size:15.5px">Every question you missed, with the text of what you heard or read.</p>
      <div class="ex-wrong">
        <sc-for list="{{exWrong}}" as="w" hint-placeholder-count="3">
          <div class="exw">
            <div class="exw-h"><b>Question {{w.n}}</b><span>{{w.part}}</span></div>
            <sc-if value="{{w.hasPic}}" hint-placeholder-val="{{ false }}"><div class="exw-pic" aria-hidden="true">{{w.pic}}</div></sc-if>
            <div class="zh exw-zh">{{w.zh}}</div>
            <div class="py">{{w.py}}</div>
            <div>{{w.en}}</div>
            <div class="exw-a"><span class="good">Right answer: {{w.right}}</span><span class="bad">You chose: {{w.yours}}</span></div>
          </div>
        </sc-for>
      </div>
    </section>
    </sc-if>
    <sc-if value="{{perfect}}" hint-placeholder-val="{{ false }}"><section class="card"><h2 class="h2">No mistakes</h2><p class="muted" style="margin:6px 0 0">Every question was right.</p></section></sc-if>
  </div>
  </sc-if>
  </sc-if>

  <!-- QUIZ (tests and grammar practice) -->
  <sc-if value="{{isQuiz}}" hint-placeholder-val="{{ false }}">
  <div class="quiz">
    <sc-if value="{{inQuestions}}" hint-placeholder-val="{{ true }}">
      <div class="q-top">
        <button class="btn" onClick="{{exitQuiz}}">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          Exit
        </button>
        <div class="segs">
          <sc-for list="{{segs}}" as="s" hint-placeholder-count="5"><span class="seg {{s.cls}}"></span></sc-for>
        </div>
        <span class="chip combo {{comboCls}}">Combo ×{{qcombo}}</span>
      </div>

      <div class="q-card {{qAnim}}">
        <div class="kick">{{q.kicker}}</div>
        <h2 class="q-prompt">{{q.prompt}}</h2>

        <sc-if value="{{q.hasBig}}" hint-placeholder-val="{{ true }}"><div class="zh q-big {{q.bigCls}}">{{q.big}}</div></sc-if>
        <sc-if value="{{q.hasSub}}" hint-placeholder-val="{{ false }}"><div class="q-sub">{{q.sub}}</div></sc-if>

        <sc-if value="{{q.isTyped}}" hint-placeholder-val="{{ true }}">
          <input id="answer-input" class="inp {{inpCls}}" type="text" value="{{qtyped}}" placeholder="{{q.placeholder}}" autocomplete="off" aria-label="Your answer" onInput="{{onType}}" onKeyDown="{{onEnter}}">
        </sc-if>

        <sc-if value="{{q.isListen}}" hint-placeholder-val="{{ false }}">
          <button class="listen {{listenCls}}" onClick="{{playQ}}" aria-label="Play the word">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          </button>
        </sc-if>

        <sc-if value="{{q.isChoice}}" hint-placeholder-val="{{ false }}">
          <div class="opts {{optsCls}}">
            <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
              <button class="opt {{o.cls}}" onClick="{{o.pick}}"><span class="{{o.lcls}}">{{o.label}}</span></button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{q.isOrder}}" hint-placeholder-val="{{ false }}">
          <div class="ans-line">
            <sc-for list="{{pickedTiles}}" as="t" hint-placeholder-count="0"><button class="tile zh {{t.cls}}" onClick="{{t.fn}}">{{t.label}}</button></sc-for>
            <sc-if value="{{noPicked}}" hint-placeholder-val="{{ true }}"><span class="ans-ph">Tap the words below in order</span></sc-if>
          </div>
          <div class="bank">
            <sc-for list="{{bankTiles}}" as="t" hint-placeholder-count="4"><button class="tile zh {{t.cls}}" onClick="{{t.fn}}">{{t.label}}</button></sc-for>
          </div>
        </sc-if>

        <sc-if value="{{q.isSpot}}" hint-placeholder-val="{{ false }}">
          <div class="spot">
            <sc-for list="{{spotTokens}}" as="t" hint-placeholder-count="5">
              <sc-if value="{{t.isTok}}" hint-placeholder-val="{{ true }}"><button class="tok zh {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-if>
              <sc-if value="{{t.isPunct}}" hint-placeholder-val="{{ false }}"><span class="punct zh">{{t.label}}</span></sc-if>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
        <button class="btn pri big {{checkCls}}" style="align-self:flex-end" aria-disabled="{{checkAria}}" onClick="{{check}}">Check</button>
      </sc-if>
      <sc-if value="{{qchecked}}" hint-placeholder-val="{{ false }}">
        <div class="fb {{fbCls}}">
          <div class="fb-ic">
            <sc-if value="{{qcorrect}}" hint-placeholder-val="{{ true }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
            <sc-if value="{{qwrong}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></sc-if>
          </div>
          <div class="fb-m">
            <div class="fb-t">{{fbTitle}}</div>
            <div class="fb-s zh">{{q.reveal}}</div>
            <div class="fb-x">{{q.explain}}</div>
            <a class="report" href="{{q.reportUrl}}" target="_blank" rel="noopener">Report a mistake</a>
          </div>
          <button class="btn ink big" onClick="{{next}}">{{nextLabel}}</button>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{qdone}}" hint-placeholder-val="{{ false }}">
      <div class="res">
        <div class="stamp zh" aria-hidden="true">好</div>
        <h2 class="res-h">{{resTitle}}</h2>
        <p class="res-p">{{resSub}}</p>
        <div class="res-stats">
          <div class="stat"><b>{{resScore}}</b><span>Correct</span></div>
          <div class="stat"><b>{{qbest}}</b><span>Best combo</span></div>
          <div class="stat"><b>+{{qxp}}</b><span>XP earned</span></div>
        </div>
        <span class="res-gain">{{resGain}}</span>
        <div class="res-act">
          <button class="btn pri big" onClick="{{again}}">Go again</button>
          <button class="btn big" onClick="{{goHome}}">Back to home</button>
        </div>
      </div>
    </sc-if>
  </div>
  </sc-if>

  <footer class="foot">
    <p>The Chinese on this site is checked by AI against a community HSK word list and has not been reviewed by a teacher yet. If something looks wrong, use "Report a mistake" next to it.</p>
    <div class="foot-act">
      <button class="linkbtn" onClick="{{goVoice}}">Settings</button>
      <button class="linkbtn" onClick="{{exportData}}">Export progress</button>
      <button class="linkbtn" onClick="{{importData}}">Import progress</button>
      <button class="linkbtn" onClick="{{resetAll}}">Reset progress</button>
      <a class="linkbtn" href="{{repoUrl}}" target="_blank" rel="noopener">Source on GitHub</a>
    </div>
  </footer>
</main>
</div>
</template>
<script src="vendor/morphdom-umd.min.js"></script>
<script src="runtime.js"></script>
<script src="data/hsk1-words.js"></script>
<script src="data/hsk1-grammar.js"></script>
<script src="data/hsk1-webs.js"></script>
<script src="data/hsk1-speak.js"></script>
<script src="data/hsk1-listen.js"></script>
<script src="data/hsk1-exam.js"></script>
<script src="data/hsk1-erhua.js"></script>
<script src="sync.js"></script>
<script src="erhua.js"></script>
<script src="app.js"></script>
</body>
</html>
