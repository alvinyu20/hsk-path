<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shanlu · HSK study path</title>
<meta name="description" content="A personal HSK study site: word webs, flashcards, listening practice and grammar.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://upload.wikimedia.org https://thumb.wikimedia.org https://api.openverse.org; font-src 'self'; media-src 'self' blob: data: https://*.aliyuncs.com; connect-src 'self' https://api.anthropic.com https://dashscope-intl.aliyuncs.com https://*.ap-southeast-1.maas.aliyuncs.com https://api.github.com https://shanlu-friends.alvinyu20.workers.dev; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="shanlu-version" content="00eea29f27">
<meta name="theme-color" content="#EDF0EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shanlu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='96'%20fill='%23C2362B'/%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='38.0'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M150.0%20206.0%20V350.0%20H362.0%20V206.0'/%3E%3Cpath%20d='M256.0%20128.0%20V350.0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=00eea29f27">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This site needs JavaScript to run.</p></noscript>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<template id="app-template">

<div class="app {{themeCls}} {{focusCls}} {{scrCls}}">

<aside class="side">
  <button type="button" class="brand" data-on-click="{{goHome}}" aria-label="Shanlu: go to Home">
    <div class="mark zh" aria-hidden="true">山</div>
    <div><div class="bname">Shanlu</div><div class="bsub">HSK study path</div></div>
  </button>

  <nav class="navs navg" aria-label="Main sections">
    <button class="{{gHomeCls}}" data-on-click="{{gHome}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
      Today
    </button>
    <button class="{{gLearnCls}}" data-on-click="{{gLearn}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>
      Learn
    </button>
    <sc-if value="{{gLearnOpen}}" hint-placeholder-val="{{ false }}"><div class="navsub" role="group" aria-label="In this section"><sc-for list="{{subnav}}" as="o" hint-placeholder-count="3"><button class="subl {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}<sc-if value="{{o.hasN}}" hint-placeholder-val="{{ false }}"><span class="n">{{o.n}}</span></sc-if></button></sc-for></div></sc-if>
    <button class="{{gReviewCls}}" data-on-click="{{gReview}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="12" rx="2.5"/><path d="M7 3.8h10"/></svg>
      Review
      <sc-if value="{{hasDue}}" hint-placeholder-val="{{ true }}"><span class="badge">{{dueCount}}</span></sc-if>
    </button>
    <sc-if value="{{gReviewOpen}}" hint-placeholder-val="{{ false }}"><div class="navsub" role="group" aria-label="In this section"><sc-for list="{{subnav}}" as="o" hint-placeholder-count="3"><button class="subl {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}<sc-if value="{{o.hasN}}" hint-placeholder-val="{{ false }}"><span class="n">{{o.n}}</span></sc-if></button></sc-for></div></sc-if>
    <button class="{{gTalkCls}}" data-on-click="{{gTalk}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
      Talk
    </button>
    <sc-if value="{{gTalkOpen}}" hint-placeholder-val="{{ false }}"><div class="navsub" role="group" aria-label="In this section"><sc-for list="{{subnav}}" as="o" hint-placeholder-count="3"><button class="subl {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}<sc-if value="{{o.hasN}}" hint-placeholder-val="{{ false }}"><span class="n">{{o.n}}</span></sc-if></button></sc-for></div></sc-if>
    <button class="{{gJourneyCls}}" data-on-click="{{gJourney}}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5l17-8.5-5 16-3.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg>
      Journey
      <sc-if value="{{jyReadyShow}}" hint-placeholder-val="{{ false }}"><span class="badge">{{jyReadyN}}</span></sc-if>
    </button>
  </nav>

  <nav class="navyou" aria-label="You">
    <sc-if value="{{youFriends}}" hint-placeholder-val="{{ false }}"><button type="button" class="{{youFriendsCls}}" data-on-click="{{goFriends}}">Friends</button></sc-if>
    <button type="button" class="{{youAchCls}}" data-on-click="{{goAch}}">Achievements</button>
    <button type="button" class="{{youSetCls}}" data-on-click="{{goSettings}}">Settings</button>
    <sc-if value="{{guideAvail}}" hint-placeholder-val="{{ false }}"><button type="button" class="{{youGuideCls}}" data-on-click="{{onbOpenGuide}}">How Shanlu works</button></sc-if>
  </nav>

  <div class="streak">
    <div class="streak-h">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.1 3.4 5 5.3 5 9.9a5 5 0 0 1-10 0c0-1.8.8-3 1.8-4.1.2 1.6 1.1 2.5 2.1 2.7C10.3 8.5 11 5.5 12 2.5z"/></svg>
      <span>{{streak}}-day streak</span>
    </div>
    <div class="week" aria-label="This week">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7"><span class="{{d.cls}}">{{d.l}}</span></sc-for>
    </div>
  </div>

  <button type="button" class="me {{navAcct}}" data-on-click="{{goAcct}}" aria-label="Open your account">
    <div class="me-av zh" aria-hidden="true"><sc-if value="{{hasAv}}" hint-placeholder-val="{{ false }}"><img src="{{avUrl}}" alt=""></sc-if><sc-if value="{{noAv}}" hint-placeholder-val="{{ true }}">{{acctInitial}}</sc-if></div>
    <div class="me-t"><b>{{acctName}}</b><div class="bsub">{{lvName}} · {{overall}}% of the way</div></div>
  </button>
  <button class="linkbtn" data-on-click="{{toggleTheme}}">{{themeLabel}}</button>
  <button type="button" class="acct-mini zh {{acctMiniCls}}" data-on-click="{{goAcct}}" aria-label="Open your account"><sc-if value="{{hasAv}}" hint-placeholder-val="{{ false }}"><img src="{{avUrl}}" alt=""></sc-if><sc-if value="{{noAv}}" hint-placeholder-val="{{ true }}">{{acctInitial}}</sc-if></button>
</aside>

<main class="main">
  <sc-if value="{{hasBack}}" hint-placeholder-val="{{ false }}"><button type="button" class="backbar" data-on-click="{{goAcct}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Account</button></sc-if>
  <sc-if value="{{inLib}}" hint-placeholder-val="{{ false }}"><button type="button" class="crumb" data-on-click="{{goLibrary}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Library</button></sc-if>
  <header class="top {{topCls}}">
    <sc-if value="{{hasTopArt}}" hint-placeholder-val="{{ false }}"><img class="top-art" src="{{topArt}}" alt="" aria-hidden="true" width="360" height="120"></sc-if>
    <div class="top-t">
      <h1 class="h1">{{title}}</h1>
      <sc-if value="{{subShow}}" hint-placeholder-val="{{ true }}"><p class="sub">{{subtitle}}</p></sc-if>
    </div>
    <div class="stats">
      <div class="lvmenu"><button type="button" class="pill lvbtn" aria-haspopup="true" aria-expanded="{{lvMenuOpen}}" data-on-click="{{lvMenuToggle}}">{{lvLabel}}<svg class="ic lvcaret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <sc-if value="{{lvMenuOpen}}" hint-placeholder-val="{{ false }}"><div class="lvpanel" role="menu" aria-label="Levels"><div class="lvh">Levels</div><sc-for list="{{lvItems}}" as="o" hint-placeholder-count="3"><button type="button" role="menuitem" class="lvitem {{o.cls}}" data-on-click="{{o.fn}}"><span class="lvn">{{o.label}}</span><span class="lvs">{{o.sub}}</span></button></sc-for></div></sc-if></div>
      <button type="button" class="pill fl" title="Back to Today" data-on-click="{{goStreak}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.1 3.4 5 5.3 5 9.9a5 5 0 0 1-10 0c0-1.8.8-3 1.8-4.1.2 1.6 1.1 2.5 2.1 2.7C10.3 8.5 11 5.5 12 2.5z"/></svg>{{streakText}}</button>
      <button type="button" class="{{xpPillCls}}" title="{{xpTip}}" data-on-click="{{goJourney}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="5.4"/></svg>{{xpTotalText}}<span class="pw"> coins</span><sc-if value="{{jyReadyShow}}" hint-placeholder-val="{{ false }}"><span class="xp-ready" aria-label="{{jyReadyLabel}}">{{jyReadyN}}</span></sc-if></button>
      <button type="button" class="pill" title="{{memTip}}" data-on-click="{{goMem}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z"/></svg>{{memText}}</button>
    </div>
  </header>
  <sc-if value="{{jyPingShow}}" hint-placeholder-val="{{ false }}"><button type="button" class="xp-ping" role="status" data-on-click="{{goJourney}}"><b>New stop unlocked</b><span>Tap to travel</span></button></sc-if>
  <sc-if value="{{msShow}}" hint-placeholder-val="{{ false }}"><div class="mstoast" role="status" aria-live="polite" data-on-click="{{msClose}}"><span class="ms-ic" aria-hidden="true">{{msIcon}}</span><div class="ms-t"><b>{{msTitle}}</b><span>{{msDesc}}</span></div><span class="ms-more">{{msMore}}</span><button type="button" class="ms-x" aria-label="Dismiss" data-on-click="{{msClose}}">×</button></div></sc-if>
  <sc-if value="{{pcNoteShow}}" hint-placeholder-val="{{ false }}"><div class="banner" role="status">{{pcNoteText}}<div style="margin-top:10px"><button class="btn" data-on-click="{{pcNoteClose}}">Got it</button></div></div></sc-if>
  <sc-if value="{{lvMsgShow}}" hint-placeholder-val="{{ false }}"><div class="banner" role="status">{{lvMsgText}}<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px"><button class="btn pri" data-on-click="{{lvMsgGo}}">{{lvMsgGoText}}</button><button class="btn" data-on-click="{{lvMsgCheck}}">Check my level</button><button class="btn" data-on-click="{{lvMsgClose}}">Dismiss</button></div></div></sc-if>
  <sc-if value="{{hasSubnav}}" hint-placeholder-val="{{ false }}"><div class="seg2 subnav" role="group" aria-label="In this section"><sc-for list="{{subnav}}" as="o" hint-placeholder-count="3"><button class="{{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for></div></sc-if>
  <sc-if value="{{saveFail}}" hint-placeholder-val="{{ false }}"><div class="banner bad" role="alert">This device could not save your progress. Its storage may be full or blocked (a private tab does this). What you do now can be lost when you close the page, so download a backup.<div style="margin-top:10px"><button class="btn pri" data-on-click="{{exportData}}">Download a backup</button></div><div class="muted" style="margin-top:8px;font-size:13px">{{saveInfo}}</div></div></sc-if>
  <sc-if value="{{swReady}}" hint-placeholder-val="{{ false }}"><div class="banner" role="status">A new version of Shanlu is ready.<div style="margin-top:10px"><button class="btn pri" data-on-click="{{updateNow}}">Reload now</button></div></div></sc-if>
  <sc-if value="{{tipShow}}" hint-placeholder-val="{{ false }}"><div class="banner" role="status">
    <sc-if value="{{tipIsInstall}}" hint-placeholder-val="{{ true }}">
      <b>Put Shanlu on your home screen.</b> It opens full screen, works without a connection, and keeps your saved progress safe: a browser may clear a website's saved data after a long time unused, an installed app is not treated that way.
      <sc-if value="{{tipIosHow}}" hint-placeholder-val="{{ true }}"> On iPhone: tap the Share button, then Add to Home Screen.</sc-if>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px"><sc-if value="{{tipCanPrompt}}" hint-placeholder-val="{{ false }}"><button class="btn pri" data-on-click="{{tipInstall}}">Install</button></sc-if><button class="btn" data-on-click="{{tipDismiss}}">Not now</button></div>
    </sc-if>
    <sc-if value="{{tipIsBackup}}" hint-placeholder-val="{{ false }}">
      <b>Your progress lives only in this browser.</b> Download a backup file now and then, or connect sync in Settings so it follows you to your other devices.
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px"><button class="btn pri" data-on-click="{{exportData}}">Download a backup</button><button class="btn" data-on-click="{{tipDismiss}}">Not now</button></div>
    </sc-if>
  </div></sc-if>
  <sc-if value="{{noVoice}}" hint-placeholder-val="{{ false }}"><div class="banner">This browser does not report a Chinese voice, so audio may be silent or sound wrong. Try Chrome or Safari, or check your device's text-to-speech language settings. <button class="linkbtn" data-on-click="{{goVoice}}">Open voice settings</button></div></sc-if>

  <!-- VOICE -->
  <sc-if value="{{isVoice}}" hint-placeholder-val="{{ false }}">
  <div class="vscreen">
    <section class="card" style="margin-bottom:20px">
      <h2 class="h2">Sync across devices</h2>
      <sc-if value="{{syncOff}}" hint-placeholder-val="{{ true }}">
        <p class="muted" style="margin:6px 0 0;font-size:16px">Your progress is saved in this browser only. To use the same progress on your phone and your computer, keep one private copy in a GitHub gist. You do this once per device.</p>
        <ol class="muted" style="margin:10px 0 0;padding-left:20px;font-size:15.5px;line-height:1.6">
          <li>Open <a href="{{syncTokenUrl}}" target="_blank" rel="noopener">this GitHub page</a> (sign in if asked). It makes a classic token with only the gist permission. Pick an expiry you are comfortable with, then press Generate token.</li>
          <li>Copy the token (it starts with ghp_) and paste it below.</li>
          <li>Press Connect. Do the same on your other devices with the same token.</li>
        </ol>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <input class="wsearch" type="password" autocomplete="off" placeholder="Paste the token" value="{{syncInput}}" data-on-input="{{onSyncInput}}" style="flex:1 1 220px;min-width:0" aria-label="GitHub token">
          <button class="btn pri" data-on-click="{{syncConnect}}">Connect</button>
        </div>
        <p class="muted" style="margin:10px 0 0;font-size:14.5px">The token is kept on this device only, never in your exported progress. It can only read and write gists. You can delete it any time at github.com/settings/tokens.</p>
      </sc-if>
      <sc-if value="{{syncOn}}" hint-placeholder-val="{{ false }}">
        <p class="muted" style="margin:6px 0 0;font-size:16px">{{syncAtText}} Progress syncs when you open the site, when you come back to the tab, and shortly after you study.</p>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <button class="btn pri" data-on-click="{{syncNow}}">Sync now</button>
          <button class="btn" data-on-click="{{syncTest}}">{{syncTestLabel}}</button>
          <button class="btn" data-on-click="{{syncDisconnect}}">Disconnect this device</button>
        </div>
      </sc-if>
      <sc-if value="{{hasSyncMsg}}" hint-placeholder-val="{{ false }}"><div class="banner {{syncMsgCls}}" style="margin-top:14px" role="status">{{syncMsg}}</div></sc-if>
    </section>
    <section class="card" style="margin-bottom:20px">
      <h2 class="h2">Saved on this device</h2>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">{{storageText}}</p>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">{{installedText}}</p>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">{{versionText}}</p>
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:10px"><button class="btn" data-on-click="{{exportData}}">Download a backup</button><button class="btn" data-on-click="{{importData}}">Import a backup</button></div>
    </section>
    <section class="card" style="margin-bottom:20px">
      <h2 class="h2">AI conversation (optional)</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">Speaking practice with a real conversation partner: you speak or type, Mingming answers in simple Chinese, may use a little of the next level ({{nextLvName}}) as a preview (with pinyin and English), and tells you what was not natural. Pick the service that writes Mingming's lines. You can save a key for both and switch any time.</p>
      <sc-if value="{{hasRelay}}" hint-placeholder-val="{{ false }}"><div class="banner" style="margin-top:12px" role="status">{{relayText}}</div></sc-if>
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{provOpts}}" as="o" hint-placeholder-count="2"><button class="fc2 {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for>
      </div>
      <sc-if value="{{provAnthropic}}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{aiCanUse}}" hint-placeholder-val="{{ false }}"><div style="margin-top:12px"><button class="btn pri" data-on-click="{{useAnth}}">Use Claude for conversation</button></div></sc-if>
      <p class="muted" style="margin:12px 0 0;font-size:16px">Claude is billed separately from a Claude.ai subscription: create a key at console.anthropic.com and add some credit there. Each message costs only a small fraction of a cent on the cheaper model, but I could not look up current prices from here, so check them on that site.</p>
      <p class="muted" style="margin:10px 0 0;font-size:14.5px">The key is stored on this device only. It is sent straight from your browser to Anthropic and is not synced or exported. Anyone who can use this browser can use the key, so set a spending limit on the key's account.</p>
      <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{aiModelOpts}}" as="m" hint-placeholder-count="2"><button class="fc2 {{m.cls}}" data-on-click="{{m.fn}}">{{m.label}}</button></sc-for>
      </div>
      <sc-if value="{{aiUnset}}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <input class="wsearch" style="margin:0;flex:1 1 220px;min-width:0" type="password" autocomplete="off" placeholder="Paste the API key" value="{{aiKeyInput}}" data-on-input="{{onAiKeyInput}}" aria-label="Anthropic API key">
          <button class="btn pri" data-on-click="{{aiSaveKey}}">Save key</button>
        </div>
      </sc-if>
      <sc-if value="{{aiSet}}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span class="muted">A key is saved on this device.</span><button class="btn" data-on-click="{{aiTestKey}}">{{aiTestLabel}}</button><button class="btn" data-on-click="{{aiRemoveKey}}">Remove the key</button></div>
      </sc-if>
      </sc-if>
      <sc-if value="{{provAlibaba}}" hint-placeholder-val="{{ false }}">
        <p class="muted" style="margin:12px 0 0;font-size:16px">Qwen runs on Alibaba Cloud Model Studio. The same key can also make a stronger voice recogniser for Mandarin (below). New accounts get a free quota. Use the International edition (Singapore).</p>
        <ol class="muted" style="margin:10px 0 0;padding-left:20px;font-size:15.5px;line-height:1.6">
          <li>Make an account at alibabacloud.com and open Model Studio in the <b>Singapore</b> region. Agree to the terms to switch it on.</li>
          <li>In Key Management (Singapore), press Create API Key (Default workspace) and copy it.</li>
          <li>Paste it below and press Save, then Test connection. The workspace ID is optional: leave it empty at first. Alibaba's newest pages use an address with your workspace ID in it, so if the test fails, paste the ID from the Model Studio console and test again.</li>
        </ol>
        <p class="muted" style="margin:10px 0 0;font-size:14.5px">The key is stored on this device only and sent straight from your browser to Alibaba. It is not synced or exported. In Model Studio, turn on "Free quota only" for each model you use, so nothing is billed when the free quota runs out. Without it, use past the free quota is billed.</p>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <input class="wsearch" style="margin:0;flex:1 1 260px;min-width:0" type="password" autocomplete="off" placeholder="Paste the Alibaba API key" value="{{aliKeyInput}}" data-on-input="{{onAliKeyInput}}" aria-label="Alibaba API key">
        </div>
        <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <input class="wsearch" style="margin:0;flex:1 1 200px;min-width:0" type="text" autocomplete="off" placeholder="Workspace ID (optional)" value="{{aliWsInput}}" data-on-input="{{onAliWsInput}}" aria-label="Alibaba workspace ID">
          <input class="wsearch" style="margin:0;flex:1 1 200px;min-width:0" type="text" autocomplete="off" placeholder="Model name" value="{{aliModelInput}}" data-on-input="{{onAliModelInput}}" aria-label="Qwen model name">
        </div>
        <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{aliModelOpts}}" as="m" hint-placeholder-count="2"><button class="fc2 {{m.cls}}" data-on-click="{{m.fn}}">{{m.label}}</button></sc-for>
        </div>
        <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
          <button class="btn pri" data-on-click="{{aliSaveKey}}">Save</button>
          <button class="btn" data-on-click="{{aliTest}}">{{aliTestLabel}}</button>
          <sc-if value="{{aliSet}}" hint-placeholder-val="{{ false }}"><span class="muted">A key is saved on this device.</span><button class="btn" data-on-click="{{aliRemoveKey}}">Remove the key</button></sc-if>
          <sc-if value="{{aliCanUse}}" hint-placeholder-val="{{ false }}"><button class="btn pri" data-on-click="{{useAli}}">Use Qwen for conversation</button></sc-if>
        </div>
        <p class="muted" style="margin:10px 0 0;font-size:14.5px">Model names change over time. If Alibaba says the model does not exist, type the current name from the Model Studio model list.</p>
      </sc-if>
      <h3 style="margin:18px 0 0;font-size:17px">What hears your voice</h3>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">The browser's own recogniser is free but can miss normal-speed Mandarin. Alibaba's Qwen3-ASR is built for Chinese. It records you, sends the clip to Alibaba, and fills the box a moment after you stop.</p>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{asrOpts}}" as="o" hint-placeholder-count="2"><button class="fc2 {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for>
      </div>
      <h3 style="margin:18px 0 0;font-size:17px">What speaks Mingming's lines</h3>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">Alibaba's Qwen voice sounds far more natural than the browser's. It uses the model qwen3-tts-flash, which has its own free quota (turn on "Free quota only" for it too). If it ever fails, the browser voice takes over.</p>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ttsOpts}}" as="o" hint-placeholder-count="2"><button class="fc2 {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for>
      </div>
      <sc-if value="{{ttsIsQwen}}" hint-placeholder-val="{{ false }}">
        <p class="muted" style="margin:12px 0 0;font-size:15px">Voice (tap one to hear it):</p>
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ttsVoiceOpts}}" as="o" hint-placeholder-count="5"><button class="fc2 {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for>
        </div>
      </sc-if>
      <h3 style="margin:18px 0 0;font-size:17px">What Mingming remembers</h3>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">Light everyday facts you tell her (a hobby, a food you like, a plan), so the next chat can pick them up naturally.</p>
      <sc-if value="{{personSyncOn}}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:6px 0 0;font-size:15.5px">They follow you: they are saved with your progress on the group's server, so every device of yours has the same ones. Only you (and whoever runs the server) can read them; the other friends cannot.</p></sc-if>
      <sc-if value="{{personSyncOff}}" hint-placeholder-val="{{ true }}"><p class="muted" style="margin:6px 0 0;font-size:15.5px">They are kept on this device. If you join the study group (Friends tab), they follow you to your other devices.</p></sc-if>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">The AI service does see them while a chat is running. Health, money, politics, religion and documents are filtered out (a keyword filter, so not perfect).</p>
      <div style="margin-top:10px"><button class="fc2 {{memCls}}" data-on-click="{{memToggle}}">{{memOnLabel}}</button></div>
      <sc-if value="{{noMemFacts}}" hint-placeholder-val="{{ true }}"><p class="muted" style="margin:10px 0 0;font-size:15px">Nothing remembered yet.</p></sc-if>
      <sc-if value="{{hasMemFacts}}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:10px">
          <sc-for list="{{memList}}" as="f" hint-placeholder-count="2"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><span>{{f.t}} <span class="muted" style="font-size:13.5px">{{f.d}}</span></span><button class="linkbtn" data-on-click="{{f.forget}}">Forget</button></div></sc-for>
        </div>
        <div style="margin-top:8px"><button class="linkbtn" data-on-click="{{memClear}}">Forget everything</button></div>
      </sc-if>
      <sc-if value="{{personSyncOn}}" hint-placeholder-val="{{ false }}">
        <h3 style="margin:18px 0 0;font-size:17px">API keys on all my devices</h3>
        <p class="muted" style="margin:6px 0 0;font-size:15.5px">Your chat settings, listening level and remembered facts already follow you. API keys stay on each device unless you switch this on. Then they are locked on this device with a passphrase you choose, and only the scrambled text is saved with your progress on the group's server, so whoever runs the server cannot read your keys. The passphrase is never sent anywhere: type it once on each device. If you forget it, switch this off and on again.</p>
        <div style="margin-top:10px"><button class="fc2 {{keySyncCls}}" data-on-click="{{keySyncToggle}}">{{keySyncLabel}}</button></div>
        <sc-if value="{{keyAsk}}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
            <input class="wsearch" style="margin:0;flex:1 1 220px;min-width:0" type="password" autocomplete="new-password" placeholder="{{keyAskHint}}" value="{{keyPassInput}}" data-on-input="{{onKeyPassInput}}" aria-label="Key passphrase">
            <button class="btn pri" data-on-click="{{keyPassGo}}">{{keyGoLabel}}</button>
          </div>
        </sc-if>
        <sc-if value="{{keyReady}}" hint-placeholder-val="{{ false }}"><div class="muted" style="margin-top:10px"><span>Your keys are locked with your passphrase.</span> <button class="linkbtn" data-on-click="{{keyChange}}">Change passphrase</button></div></sc-if>
        <sc-if value="{{keyMsgShow}}" hint-placeholder-val="{{ false }}"><div class="banner" style="margin-top:10px" role="status">{{keyMsgText}}</div></sc-if>
      </sc-if>
      <sc-if value="{{hasAliNote}}" hint-placeholder-val="{{ false }}"><div class="banner" style="margin-top:12px" role="status">{{aliNote}}</div></sc-if>
      <sc-if value="{{hasAiNote}}" hint-placeholder-val="{{ false }}"><div class="banner" style="margin-top:12px" role="status">{{aiNote}}</div></sc-if>
    </section>
    <section class="card">
      <h2 class="h2">Reviews</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">A word comes back when your chance of recalling it falls to this level. A lower level means fewer reviews but more forgetting.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><sc-for list="{{retOpts}}" as="o" hint-placeholder-count="3"><button class="fc2 {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for></div>
      <div style="margin:16px 0 0;font-weight:600">Tones in typed answers</div>
      <p class="muted" style="margin:6px 0 0;font-size:15.5px">Type pinyin with tone marks or numbers (nǐ hǎo or ni3 hao3). Tones count, because they are the hardest part. If you are just starting, you can make them optional for now.</p>
      <div style="margin-top:10px"><button class="fc2 {{tonesCls}}" data-on-click="{{toggleTones}}">{{tonesLabel}}</button></div>
    </section>
    <section class="card">
      <h2 class="h2">Chinese voice</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">{{voiceIntro}}</p>
      <p class="muted" style="margin:10px 0 0;font-size:15.5px">On iPhone, download an Enhanced or Premium voice in Settings, Accessibility, Read &amp; Speak, Voices (it is called Spoken Content on older versions), then come back here and tap Refresh. Voices named Siri may not be offered to websites at all. If a voice you downloaded is missing from this list, your browser is not passing it on to websites.</p>
      <div style="margin:16px 0 0;font-weight:600">Speaking speed</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"><sc-for list="{{speedOpts}}" as="o" hint-placeholder-count="4"><button class="fc2 {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for></div>
      <p class="muted" style="margin:8px 0 0;font-size:15px">{{speedNote}}</p>
      <div class="vlist">
        <div class="vrow {{autoCls}}">
          <div><b>{{autoName}}</b><span>Picks the highest-quality Mandarin voice, then prefers mainland over Taiwan</span></div>
          <div class="vact"><button class="fc2 {{autoPlayCls}}" data-on-click="{{autoPlay}}">Play</button><button class="fc2 {{autoCls}}" data-on-click="{{useAuto}}">{{autoLabel}}</button></div>
        </div>
        <sc-for list="{{voiceRows}}" as="v" hint-placeholder-count="3">
          <div class="vrow {{v.cls}}">
            <div><b>{{v.name}}</b><span>{{v.meta}}</span></div>
            <div class="vact"><button class="fc2 {{v.playCls}}" data-on-click="{{v.play}}">Play</button><button class="fc2 {{v.useCls}}" data-on-click="{{v.use}}">{{v.useLabel}}</button></div>
          </div>
        </sc-for>
      </div>
      <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <button class="btn pri" data-on-click="{{refreshVoices}}">Refresh</button>
        <button class="btn" data-on-click="{{goHome}}">Back to home</button>
        <button class="linkbtn" data-on-click="{{toggleAllVoices}}">{{allVoicesBtn}}</button>
      </div>
      <sc-if value="{{showAllVoices}}" hint-placeholder-val="{{ false }}">
        <ul class="vall"><sc-for list="{{everyVoice}}" as="e" hint-placeholder-count="3"><li>{{e.line}}</li></sc-for></ul>
      </sc-if>
    </section>
    <section class="card" style="margin-top:20px">
      <h2 class="h2">Sounds</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">A short ding when you get something right, a soft tone when you do not, and a flourish when you finish a session or earn a milestone. They are made on the spot, with no downloads.</p>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px"><button class="btn pri" data-on-click="{{soundToggle}}">{{soundLabel}}</button><button class="btn" data-on-click="{{soundTest}}">Play the right-answer sound</button><button class="btn" data-on-click="{{soundTestDone}}">Play the session-done sound</button></div>
    </section>
    <section class="card" style="margin-top:20px">
      <h2 class="h2">Level</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">{{lvNote}}</p>
      <div class="lvlist" role="group" aria-label="Level"><sc-for list="{{lvItems}}" as="o" hint-placeholder-count="3"><button type="button" class="lvitem {{o.cls}}" data-on-click="{{o.fn}}"><span class="lvn">{{o.label}}</span><span class="lvs">{{o.sub}}</span></button></sc-for></div>
      <div style="margin:16px 0 0;font-weight:600">HSK version shown on your path</div>
      <div class="seg2" style="margin-top:8px;display:inline-flex" role="group" aria-label="HSK version"><button class="{{sys2Cls}}" data-on-click="{{setSys2}}">HSK 2.0 · 6 levels</button><button class="{{sys3Cls}}" data-on-click="{{setSys3}}">HSK 3.0 · 9 levels</button></div>
      <div style="margin:16px 0 0;font-weight:600">Already know some Chinese?</div>
      <p class="muted" style="margin:6px 0 0;font-size:15px">A short check (about 3 minutes) finds the levels you know, so you can start higher. Words you skip come back in Review, about 20 a day.</p>
      <div style="margin-top:8px"><button class="btn" data-on-click="{{pcOpenMenu}}">Check my level</button></div>
      <div style="margin:16px 0 0;font-weight:600">Level lock</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"><sc-for list="{{lockOpts}}" as="o" hint-placeholder-count="2"><button class="fc2 {{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for></div>
      <p class="muted" style="margin:8px 0 0;font-size:15px">Locked is the default. The level exams are AI-written and AI-checked, and the pictures use emoji that look different on different devices, so if an unclear question holds you back, switching the lock to open is fine: the exam then only earns the level's seal.</p>
    </section>
    <sc-if value="{{erhuaAvailable}}" hint-placeholder-val="{{ true }}">
    <section class="card" style="margin-top:20px">
      <h2 class="h2">儿 endings</h2>
      <p class="muted" style="margin:6px 0 0;font-size:16px">In the northern, Beijing style, some words end in 儿: 面条儿, 一点儿, 这儿, 哪儿. Many speakers, especially in the south and in Taiwan, say 面条, 一点, 这里 and 哪里 instead. This site uses the plain forms unless you switch.</p>
      <p class="muted" style="margin:10px 0 0;font-size:15.5px">The official HSK 1, HSK 2 and HSK 3 word lists print the 儿 forms, so you may still meet them on the exam. Switching reloads the page. Your progress on these words carries over. With plain forms on, 这儿, 那儿 and 哪儿 are left out, because 这里, 那里 and 哪里 are already on the list.</p>
      <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <button class="btn pri" data-on-click="{{toggleErhua}}">{{erhuaBtn}}</button>
        <span class="muted">{{erhuaNow}}</span>
      </div>
    </section>
    </sc-if>
  </div>
  </sc-if>

  <!-- HOW SHANLU WORKS -->
  <sc-if value="{{isGuide}}" hint-placeholder-val="{{ false }}">

      <div class="gd-hero">
        <div class="gd-hero-t">
          <h2 class="gd-h1">Small steps every day. Real places at the end of them.</h2>
          <p class="gd-lead">Fifteen to twenty minutes is plenty. You learn words, bring them back before you forget, and spend the coins you earn on a journey through China.</p>
        </div>
        <div class="gd-seal zh" aria-hidden="true">山</div>
      </div>

      <div class="gd-sounds">
        <div class="gd-sounds-g zh" aria-hidden="true">拼音</div>
        <div class="gd-sounds-t"><h3>New to Chinese? Start with the sounds.</h3><p>Pinyin spells how Chinese sounds, and the four tones change what a word means. Seven short lessons, about 30 minutes in all, with sounds you can tap to hear.</p></div>
        <button class="btn pri" data-on-click="{{goPinyin}}">Open the pinyin course</button>
      </div>

      <div class="gd-sec"><div class="kick">A day on Shanlu</div><h3 class="gd-h2">Three things, in this order</h3></div>
      <div class="gd-loop">
        <div class="gd-step"><div class="gd-big zh" aria-hidden="true">见</div><h4>1. Meet new words</h4><p>Each stop on the Path brings a handful of related words. You meet each one, then try it. Meeting a word is not knowing it yet.</p><div class="gd-chips"><span>Path</span><span>Library</span></div></div>
        <div class="gd-step"><div class="gd-big zh" aria-hidden="true">记</div><h4>2. Recall them in Review</h4><p>Pick the meaning, then type it. Review brings the word back just as you are about to forget it. Be honest with the buttons: Again, Hard, Good, Easy.</p><div class="gd-chips"><span>Review</span><span>My words</span></div></div>
        <div class="gd-step"><div class="gd-big zh" aria-hidden="true">用</div><h4>3. Use them</h4><p>Add grammar, listening or speaking. The Today list on Home puts together a short plan for your daily goal, which you can change any time.</p><div class="gd-chips"><span>Grammar</span><span>Listening</span><span>Speaking</span></div></div>
      </div>

      <div class="gd-coins">
        <div class="gd-coins-t">
          <div class="kick">Coins and the Journey</div>
          <h3 class="gd-h2">Everything you study earns coins</h3>
          <p>Spend them on the Journey. Each stop is a real place, dish or piece of culture, with its Chinese name. Finish a province and it is stamped in your passport.</p>
          <p class="gd-small">The memory number at the top is different: it estimates how many words you would recall right now, and it falls if you stop reviewing.</p>
        </div>
        <div class="gd-ladder" role="group" aria-label="What each stop costs">
          <div class="gd-rung free"><b>Free</b><span>1st stop</span></div>
          <div class="gd-rung"><b>50</b><span>2nd</span></div>
          <div class="gd-rung"><b>100</b><span>3rd</span></div>
          <div class="gd-rung"><b>200</b><span>4th</span></div>
          <div class="gd-rung"><b>300</b><span>5th</span></div>
          <div class="gd-rung"><b>400</b><span>6th</span></div>
          <div class="gd-rung"><b>500</b><span>then each</span></div>
        </div>
      </div>

      <div class="gd-sec"><div class="kick">What each part is for</div><h3 class="gd-h2">Your toolkit</h3></div>
      <div class="gd-tools">
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">路</div><div><b>Path</b><span>Your road through the level: word stops and grammar stops in a sensible order, with the next one always one tap away.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">库</div><div><b>Library</b><span>Look things up: topics, shared characters, word pairs, grammar and sounds, with a Study view for revising what you have met.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">词</div><div><b>Review</b><span>The words that are due, based on how well you remember each one. This is the heart of the site.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">语</div><div><b>Grammar and Grammar review</b><span>One lesson at a time with practice. Points you pass join Grammar review, where the weakest come first.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">听</div><div><b>Listening lab</b><span>Dictation and shadowing at different speeds, plus a tone trainer for training your ear.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">说</div><div><b>Speaking</b><span>Short scripted conversations to say out loud. The AI conversation with Mingming is optional and needs a key in Settings.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">测</div><div><b>Test</b><span>Mixed questions from the words you have started, so you recall words instead of only recognising them.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">考</div><div><b>Level exam</b><span>A mock exam for the level, listening and reading. Pass it to open the next level.</span></div></div>
        <div class="gd-tool"><div class="gd-tg zh" aria-hidden="true">我</div><div><b>My words</b><span>How well you know each word, and when it needs a refresh.</span></div></div>
      </div>

      <div class="gd-levels">
        <div class="gd-levels-t">
          <div class="kick">Levels</div>
          <h3 class="gd-h2">Nine HSK levels, one ladder</h3>
          <p>HSK 1 to 4 are built, and 5 to 9 are on the way. To open the next level, pass the mock exam with 80% in both listening and reading. Switch level any time from the HSK menu at the top, or choose All levels to study everything you have unlocked together.</p>
          <p class="gd-small">Already know the early levels? <button class="linkbtn" data-on-click="{{pcOpenMenu}}">Check my level</button>: about 3 minutes, and you start higher.</p>
        </div>
        <div class="gd-rungs" role="img" aria-label="Nine HSK levels: 1 to 4 available, 5 to 9 coming">
          <sc-for list="{{guideLevels}}" as="v" hint-placeholder-count="9"><div class="{{v.cls}}" style="height:{{v.h}}"><b>{{v.n}}</b></div></sc-for>
        </div>
      </div>

      <div class="gd-end">
        <div class="gd-me">
          <div class="gd-big zh" aria-hidden="true">友</div>
          <h3 class="gd-h2">Your progress and your friends</h3>
          <p>Your progress is saved in this browser. Download a backup, or connect sync in Settings, so it follows you to your other devices. If you join the study group, only your study totals are shared, and your personal link (Friends, then "Copy my link") brings your progress to a new device.</p>
          <div class="ob-act"><button class="btn pri" data-on-click="{{goVoice}}">Open Settings</button><button class="btn" data-on-click="{{goHome}}">Back to home</button></div>
        </div>
      </div>
    </section>
  </div>
  </sc-if>

  <!-- PINYIN AND TONES -->
  <sc-if value="{{isPinyin}}" hint-placeholder-val="{{ false }}">

    <section class="py" aria-label="Pinyin and tones">

            </button>
          </sc-for>
          <button type="button" class="py-lesson py-chartbtn" data-on-click="{{pyOpenChart}}">
            <span class="py-glyph zh" aria-hidden="true">表</span>
            <span class="py-lt"><b>Sound chart</b><span>Every syllable in HSK 1 to 4 that has a character to say it: tap one to hear it in each tone.</span></span>
            <span class="py-st">Open</span>
          </button>
        </div>
        <p class="muted py-honest">Written by AI and not yet read by a Chinese teacher. The English sound comparisons are rough, and the voice you hear is your device&rsquo;s own.</p>
      </sc-if>

      <sc-if value="{{pyIsLesson}}" hint-placeholder-val="{{ false }}">
        <div class="py-nav"><button type="button" class="linkbtn" data-on-click="{{pyBack}}">&larr; All lessons</button><span class="muted">{{pyLessonNo}}</span></div>

                </div>

            <sc-if value="{{b.isPair}}" hint-placeholder-val="{{ false }}">

            <sc-if value="{{b.isTones}}" hint-placeholder-val="{{ false }}">

                  <b>{{t.name}}</b><span class="py-td">{{t.desc}}</span><span class="py-tx"><span class="zh">{{t.zh}}</span> {{t.py}} &middot; {{t.en}}</span>

            </sc-if>

            <sc-if value="{{b.isTyping}}" hint-placeholder-val="{{ false }}">

                  <li>Put the <b>tone as a number</b> after each syllable: <b>ni3 hao3</b> becomes nǐ hǎo. Tone marks (nǐ hǎo) work too.</li>
                  <li><b>1</b> high and level &middot; <b>2</b> rising &middot; <b>3</b> dip &middot; <b>4</b> falling &middot; <b>neutral tone</b>: no number (or 5).</li>

          <sc-if value="{{pyHasInfo}}" hint-placeholder-val="{{ false }}"><div class="py-info" role="status"><span class="zh">{{pyInfoZh}}</span> <b>{{pyInfoPy}}</b> &middot; {{pyInfoEn}}</div></sc-if>
        </div>
      </sc-if>

    </section>

  <!-- LISTENING LAB -->

              <div class="muted">{{playedText}} {{rateHint}}</div>

          </div>

            <sc-if value="{{hasQfeed}}" hint-placeholder-val="{{ false }}"><div class="fb-x">{{qfeed}}</div></sc-if>
            <div class="fb-s zh">{{q.reveal}}</div>
            <sc-if value="{{q.hasRevealPy}}" hint-placeholder-val="{{ false }}"><div class="fb-x fb-py">{{q.revealPy}}</div></sc-if>
            <div class="fb-x">{{q.explain}}</div>
            <a class="report" href="{{q.reportUrl}}" target="_blank" rel="noopener">Report a mistake</a>
          </div>
          <button class="btn ink big" data-on-click="{{next}}">{{nextLabel}}</button>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{qdone}}" hint-placeholder-val="{{ false }}">
      <div class="res">
        <div class="stamp zh" aria-hidden="true">好</div>
        <h2 class="res-h">{{resTitle}}</h2>
        <p class="res-p">{{resSub}}</p>
        <div class="res-stats">
          <div class="stat"><b>{{resScore}}</b><span>Correct</span></div>
          <div class="stat"><b>{{qbest}}</b><span>Best combo</span></div>
          <div class="stat"><b>{{memWords}}</b><span>words in memory</span></div>
        </div>
        <span class="res-gain">{{resGain}}</span>
        <div class="res-act">
          <button class="btn pri big" data-on-click="{{again}}">Go again</button>
          <button class="btn big" data-on-click="{{goHome}}">Back to home</button>
        </div>
      </div>
    </sc-if>
  </div>
  </sc-if>

  <footer class="foot">
    <p>The Chinese on this site is checked by AI against a community HSK word list and has not been reviewed by a teacher yet. If something looks wrong, use "Report a mistake" next to it.</p>
    <div class="foot-act">
      <button class="linkbtn" data-on-click="{{goVoice}}">Settings</button>
      <button class="linkbtn" data-on-click="{{exportData}}">Export progress</button>
      <button class="linkbtn" data-on-click="{{importData}}">Import progress</button>
      <button class="linkbtn" data-on-click="{{resetAll}}">Reset progress</button>
      <a class="linkbtn" href="{{repoUrl}}" target="_blank" rel="noopener">Source on GitHub</a>
    </div>
  </footer>
</main>

  <!-- FIRST VISIT: intro pop-up, back on a new device, five guide cards, where to start, name and friends -->
  <sc-if value="{{obIntroShow}}" hint-placeholder-val="{{ false }}">
  <div class="obm-wrap"><div class="obm-scrim"></div>
    <div class="obm" role="dialog" aria-modal="true" aria-labelledby="obm-t-intro">
      <div class="mark obm-mark zh" aria-hidden="true">山</div>
      <h2 class="obm-h" id="obm-t-intro">Welcome to Shanlu</h2>
      <p class="obm-p">Learn Chinese a little each day. Every minute you study earns coins, and coins take you to real places across China.</p>
      <div class="obm-pts">
        <div><b class="zh" aria-hidden="true">学</b><span>A few words a day</span></div>
        <div><b class="zh" aria-hidden="true">币</b><span>Coins for every minute</span></div>
        <div><b class="zh" aria-hidden="true">路</b><span>Real places to visit</span></div>
      </div>
      <button class="btn pri big obm-main" data-on-click="{{obIntroGo}}">Take my first step</button>
      <button class="linkbtn obm-link" data-on-click="{{obBackOpen}}">I have been here before</button>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{obBackShow}}" hint-placeholder-val="{{ false }}">
  <div class="obm-wrap"><div class="obm-scrim"></div>
    <div class="obm" role="dialog" aria-modal="true" aria-labelledby="obm-t-back">
      <h2 class="obm-h" id="obm-t-back">Welcome back</h2>
      <p class="obm-p">Bring your progress to this device.</p>
      <sc-if value="{{obHasErr}}" hint-placeholder-val="{{ false }}"><div class="banner err" role="alert">{{obErrText}}</div></sc-if>
      <sc-if value="{{obFrOn}}" hint-placeholder-val="{{ false }}">
        <label class="kick" for="ob-link">Your personal link</label>
        <input id="ob-link" class="inp obm-inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your link here" value="{{obLinkIn}}" data-on-input="{{onObLink}}">
        <p class="obm-note">On the device where you already study, open Friends and tap "Copy my link". Send it to yourself, then paste it here. Only people who joined the study group have one.</p>
        <button class="btn pri big obm-main" data-on-click="{{obBackGo}}">{{obLinkText}}</button>
      </sc-if>
      <button class="btn big obm-main" data-on-click="{{obBackFile}}">Restore from a backup file</button>
      <button class="linkbtn obm-link" data-on-click="{{obBackClose}}">Back</button>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{obGuideShow}}" hint-placeholder-val="{{ false }}">
  <div class="obm-wrap obm-late"><div class="obm-scrim"></div>
    <div class="obm obm-guide" role="dialog" aria-modal="true" aria-labelledby="obm-t-guide">
      <div class="obm-bar"><span class="kick">{{obCCount}}</span><button class="linkbtn" data-on-click="{{obGuideSkip}}">Skip</button></div>
      <div class="obm-shot {{obCArt}}" style="{{obCShot}}" role="img" aria-label="{{obCAlt}}"><b class="zh" aria-hidden="true">{{obCZh}}</b><i class="obm-shot-img" style="{{obCImg}}"></i></div>
      <div class="obm-tagrow"><span class="obm-tagzh zh" aria-hidden="true">{{obCZh}}</span><span class="kick">{{obCTag}}</span></div>
      <h2 class="obm-h" id="obm-t-guide">{{obCTitle}}</h2>
      <p class="obm-p">{{obCBody}}</p>
      <div class="obm-chips"><sc-for list="{{obCChips}}" as="c" hint-placeholder-count="2"><span class="chip">{{c}}</span></sc-for></div>
      <div class="obm-dots" aria-hidden="true"><sc-for list="{{obCDots}}" as="d" hint-placeholder-count="5"><i class="{{d.cls}}"></i></sc-for></div>
      <div class="obm-nav">
        <sc-if value="{{obCPrev}}" hint-placeholder-val="{{ false }}"><button class="btn big" data-on-click="{{obCardPrev}}">Back</button></sc-if>
        <button class="btn pri big obm-grow" data-on-click="{{obCardNext}}">{{obCBtn}}</button>
      </div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{obLevelShow}}" hint-placeholder-val="{{ false }}">
  <div class="obm-wrap"><div class="obm-scrim"></div>
    <div class="obm" role="dialog" aria-modal="true" aria-labelledby="obm-t-level">
      <h2 class="obm-h" id="obm-t-level">Where are you starting?</h2>
      <p class="obm-p">This only decides what we show you first. You can run the level check again any time from Settings.</p>
      <div class="obm-opts" role="group" aria-label="Where you are starting">
        <sc-for list="{{obLvlOpts}}" as="o" hint-placeholder-count="2">
          <button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" data-on-click="{{o.fn}}"><b>{{o.t}}</b><span>{{o.d}}</span><sc-if value="{{o.hasTag}}" hint-placeholder-val="{{ false }}"><i class="obm-tag">{{o.tag}}</i></sc-if></button>
        </sc-for>
        <button type="button" class="{{obTestCls}}" aria-pressed="{{obTestPressed}}" data-on-click="{{obTestPick}}"><b>Test out of a level</b><span>A short check (about 3 minutes) on the level you pick, so you can skip what you already know. After your name, you take it.</span></button>
      </div>
      <button class="btn pri big obm-main" data-on-click="{{obLevelGo}}">Continue</button>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{obMeShow}}" hint-placeholder-val="{{ false }}">
  <div class="obm-wrap"><div class="obm-scrim"></div>
    <div class="obm" role="dialog" aria-modal="true" aria-labelledby="obm-t-me">
      <h2 class="obm-h" id="obm-t-me">Make it yours</h2>
      <p class="obm-p">Add a name, or stay a guest. Either way your progress is saved in this browser.</p>
      <label class="kick" for="ob-name">First name</label>
      <input id="ob-name" class="inp obm-inp" type="text" maxlength="20" autocomplete="off" placeholder="What should friends call you?" value="{{obName}}" data-on-input="{{onObName}}">
      <sc-if value="{{obFrShow}}" hint-placeholder-val="{{ false }}">
        <button type="button" role="checkbox" aria-checked="{{obJoinChk}}" class="{{obJoinCls}}" data-on-click="{{obJoinToggle}}"><i aria-hidden="true"></i><span><b>Join the study group</b><em>See each other's minutes and streaks. Friends only ever see your study totals, and it also keeps your progress safe for your other devices.</em></span></button>
      </sc-if>
      <div class="goalrow obm-goal">
        <span class="muted">Daily goal</span>
        <div class="seg2" role="group" aria-label="Daily time goal"><sc-for list="{{obGoals}}" as="o" hint-placeholder-count="4"><button class="{{o.cls}}" data-on-click="{{o.fn}}">{{o.label}}</button></sc-for></div>
      </div>
      <sc-if value="{{obHasMeErr}}" hint-placeholder-val="{{ false }}"><div class="banner err" role="alert">{{obMeErr}}</div></sc-if>
      <button class="btn pri big obm-main" disabled="{{obMeBusy}}" data-on-click="{{obMeGo}}">{{obGoText}}</button>
      <div class="obm-two"><button class="linkbtn obm-link" data-on-click="{{obGuideGo}}">Stay a guest for now</button><button class="linkbtn obm-link" data-on-click="{{obMeBack}}">Back</button></div>
    </div>
  </div>
  </sc-if>
  <sc-if value="{{pcShow}}" hint-placeholder-val="{{ false }}">
  <div class="obm-wrap pc-wrap"><div class="obm-scrim"></div>
    <div class="obm pc" role="dialog" aria-modal="true" aria-label="Level check">
      <sc-if value="{{pcClaimShow}}" hint-placeholder-val="{{ false }}">
        <h2 class="obm-h">Test out of a level</h2>
        <p class="obm-p">Pick the highest level you think you already know. We start there and work down, about 3 minutes. It only decides where you start: nothing is certified.</p>
        <div class="obm-opts" role="group" aria-label="The highest level you know">
          <sc-for list="{{pcClaims}}" as="o" hint-placeholder-count="4">
            <button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" data-on-click="{{o.fn}}"><b>{{o.t}}</b><span>{{o.d}}</span></button>
          </sc-for>
        </div>
        <button class="btn pri big obm-main" data-on-click="{{pcStart}}">Start the check</button>
        <button class="linkbtn obm-link" data-on-click="{{pcCancel}}">{{pcCancelText}}</button>
      </sc-if>
      <sc-if value="{{pcAskShow}}" hint-placeholder-val="{{ false }}">
        <div class="obm-bar"><span class="kick">{{pcLabel}}</span><button class="linkbtn" data-on-click="{{pcCancel}}">Stop</button></div>
        <div class="pc-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pcPctN}}"><i style="width:{{pcPct}}"></i></div>
        <sc-if value="{{pcIsWord}}" hint-placeholder-val="{{ false }}">
          <p class="obm-note pc-q">What does this word mean?</p>
          <div class="pc-zh zh" lang="zh">{{pcZh}}</div>
          <sc-if value="{{pcPyOn}}" hint-placeholder-val="{{ false }}"><div class="pc-py">{{pcPy}}</div></sc-if>
          <button class="linkbtn pc-pybtn" data-on-click="{{pcPyToggle}}">{{pcPyText}}</button>
        </sc-if>
        <sc-if value="{{pcIsGrammar}}" hint-placeholder-val="{{ false }}"><h2 class="obm-h pc-prompt">{{pcPrompt}}</h2></sc-if>
        <div class="obm-opts" role="group" aria-label="Answers">
          <sc-for list="{{pcOpts}}" as="o" hint-placeholder-count="4">
            <button type="button" class="obm-opt pc-ans" data-on-click="{{o.fn}}"><b class="{{o.cls}}">{{o.t}}</b></button>
          </sc-for>
        </div>
        <button class="btn big obm-main" data-on-click="{{pcDontKnow}}">I don't know</button>
        <p class="obm-note pc-tip">Not sure? "I don't know" is better than guessing: it helps us place you more accurately.</p>
      </sc-if>
      <sc-if value="{{pcResultShow}}" hint-placeholder-val="{{ false }}">
        <h2 class="obm-h">{{pcResHead}}</h2>
        <p class="obm-p">{{pcResLead}}</p>
        <sc-if value="{{pcResPlaced}}" hint-placeholder-val="{{ false }}">
          <ul class="pc-list">
            <li>{{pcResWords}}</li>
            <li>This is an estimate. Passing the level exam is what earns the seal.</li>
          </ul>
        </sc-if>
        <button class="btn pri big obm-main" data-on-click="{{pcResGo}}">{{pcResGoText}}</button>
        <sc-if value="{{pcResPlaced}}" hint-placeholder-val="{{ false }}"><button class="linkbtn obm-link" data-on-click="{{pcCancel}}">Not now</button></sc-if>
        <sc-if value="{{pcResRetry}}" hint-placeholder-val="{{ false }}"><button class="linkbtn obm-link" data-on-click="{{pcRetry}}">Try a different level</button></sc-if>
      </sc-if>
    </div>
  </div>
  </sc-if>
</div>
</template>
